<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>学習フロー | study_supportAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ui:'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,-apple-system,Meiryo,sans-serif;--font-head:'Space Grotesk','Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;--bg:#f4f5f7;--surface:#fff;--surface-hover:#f4f5f7;--ink:#172b4d;--ink-2:#42526e;--ink-3:#6b778c;--line:#dfe1e6;--line-soft:#ebecf0;--accent:#0052cc;--accent-hover:#0747a6;--accent-soft:#e9f2ff;--ok:#00875a;--ok-soft:#e3fcef;--ng:#de350b;--ng-soft:#ffebe6;--warn:#ff8b00;--warn-soft:#fffae6;--violet:#6554c0;--violet-soft:#f0eeff;--link:#0052cc;--shadow-raised:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--shadow-overlay:0 12px 24px -6px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--r-sm:4px;--r:8px}
[data-theme="dark"]{--bg:#161a1d;--surface:#22272b;--surface-hover:#282e33;--ink:#c7d1db;--ink-2:#9fadbc;--ink-3:#8993a4;--line:#454f59;--line-soft:#38414a;--accent:#579dff;--accent-hover:#85b8ff;--accent-soft:#1d2a44;--ok:#4bce97;--ok-soft:#164b35;--ng:#ff5630;--ng-soft:#4a1d15;--warn:#ffab00;--warn-soft:#4d3a0a;--violet:#9f8fef;--violet-soft:#352c63;--link:#579dff;--shadow-raised:0 1px 1px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.7);--shadow-overlay:0 12px 24px -6px rgba(0,0,0,.6),0 0 1px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.7;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;min-height:100vh}
a{color:var(--link);text-decoration:none}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:50}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700;flex-shrink:0}
.brand b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:2px}
.nav .item{color:var(--ink-2);text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:var(--r-sm);transition:background .12s,color .12s;white-space:nowrap}
.nav .item:hover{background:var(--surface-hover);color:var(--ink)}
.nav .item.active{color:var(--accent);background:var(--accent-soft)}
.topbar .spacer{flex:1}
@media(max-width:640px){.topbar{flex-wrap:wrap;gap:8px 16px}.nav{flex:1 1 100%;order:5;justify-content:center;padding:2px 0 0}}
.theme-btn{background:var(--surface-hover);border:1px solid var(--line-soft);color:var(--ink-2);width:34px;height:34px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s}
.theme-btn:hover{background:var(--line-soft);color:var(--ink)}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}
.btn{display:inline-flex;align-items:center;gap:6px;font-family:inherit;font-size:.85rem;font-weight:600;color:var(--ink-2);background:var(--surface-hover);border:1px solid var(--line);border-radius:var(--r-sm);padding:9px 16px;cursor:pointer;transition:background .12s,border .12s,color .12s;text-decoration:none;white-space:nowrap}
.btn:hover{background:var(--line-soft);color:var(--ink)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.sm{padding:6px 10px;font-size:.76rem}
.btn:disabled{opacity:.45;cursor:default;pointer-events:none}
.btn.danger{background:var(--ng-soft);border-color:transparent;color:var(--ng)}
.btn.danger:hover{background:var(--ng-soft);color:var(--ng);opacity:.85}

.wrap{max-width:720px;margin:0 auto;padding:20px 16px 80px}
.headcard{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow-raised);padding:18px 20px}
.headcard .top{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.headcard .back{font-size:.78rem;font-weight:600;color:var(--ink-2)}
.headcard .back:hover{color:var(--accent)}
.headcard .tag{font-size:.68rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);flex:1}
.headcard .dd{font-family:var(--font-head);font-size:.78rem;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:3px 10px;border-radius:99px}
.headcard h1{font-family:var(--font-head);font-weight:600;font-size:1.28rem;letter-spacing:-.01em}
.headcard .sub{font-size:.8rem;color:var(--ink-2);margin-top:4px}
.badge{display:inline-block;font-size:.66rem;font-weight:700;padding:2px 8px;border-radius:99px}
.badge.b-ok{background:var(--ok-soft);color:var(--ok)}
.badge.b-prog{background:var(--accent-soft);color:var(--accent)}
.badge.b-warn{background:var(--warn-soft);color:var(--warn)}
.badge.b-ng{background:var(--ng-soft);color:var(--ng)}
.badge.b-idle{background:var(--surface-hover);color:var(--ink-2)}

.stepper{display:flex;gap:8px;margin:18px 0 14px;overflow-x:auto}
.step{flex:1;min-width:120px;display:flex;align-items:center;gap:8px;padding:10px 12px;border-radius:var(--r);background:var(--surface);border:1px solid var(--line-soft);opacity:.55}
.step .sn{width:22px;height:22px;border-radius:99px;background:var(--ink-3);color:#fff;font-size:.72rem;font-weight:700;display:grid;place-items:center;flex-shrink:0}
.step .sl{font-size:.76rem;font-weight:600;color:var(--ink-2);white-space:nowrap}
.step.cur{border-color:var(--accent);opacity:1}
.step.cur .sn{background:var(--accent)}
.step.cur .sl{color:var(--ink)}
.step.done{opacity:.75}
.step.done .sn{background:var(--ok)}

.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow-raised);padding:24px 24px 20px;margin-bottom:16px}
.sec-t{font-family:var(--font-head);font-size:.92rem;font-weight:700;color:var(--ink);margin-bottom:4px}
.lead{font-size:.8rem;color:var(--ink-2);margin-bottom:16px}
.exp{background:var(--surface-subtle);border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:16px 18px;font-size:.9rem;color:var(--ink);margin-bottom:14px}
.tip{font-size:.74rem;color:var(--ink-3);margin-top:4px}
.q{border:1px solid var(--line-soft);border-radius:var(--r-sm);padding:14px 16px;margin-bottom:12px;background:var(--surface-subtle)}
.q .qt{font-size:.86rem;font-weight:600;color:var(--ink);margin-bottom:10px}
.qrow{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.qrow input{flex:1;min-width:200px;font-family:inherit;font-size:.85rem;padding:8px 10px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink)}
.qrow input:disabled{opacity:.6}
.qrow input:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.ans{display:none;margin-top:8px;font-size:.8rem;color:var(--ok);background:var(--ok-soft);border-radius:var(--r-sm);padding:8px 12px;font-weight:600}
.mark{display:flex;gap:8px;margin-top:10px}
.mk{flex:1;font-family:inherit;font-size:.78rem;font-weight:600;padding:7px 10px;border-radius:var(--r-sm);border:1px solid var(--line);background:var(--surface);color:var(--ink-2);cursor:pointer;transition:all .12s}
.mk.ok:hover{border-color:var(--ok);color:var(--ok)}
.mk.no:hover{border-color:var(--ng);color:var(--ng)}
.mk.ok.sel{background:var(--ok-soft);border-color:var(--ok);color:var(--ok)}
.mk.no.sel{background:var(--ng-soft);border-color:var(--ng);color:var(--ng)}
.btn.ai{background:var(--violet-soft);border-color:var(--violet);color:var(--violet)}
.btn.ai:hover{background:var(--violet-soft);color:var(--violet);opacity:.85}
.feedback{display:none;margin-top:8px;font-size:.8rem;border-radius:var(--r-sm);padding:8px 12px;font-weight:600;line-height:1.5}
.feedback.show{display:block}
.feedback.ok{background:var(--ok-soft);color:var(--ok)}
.feedback.no{background:var(--ng-soft);color:var(--ng)}
.feedback.busy{background:var(--surface-hover);color:var(--ink-2)}
.ask{display:none;margin-top:10px;border-top:1px dashed var(--line);padding-top:10px}
.ask.show{display:block}
.ask .ak{font-size:.78rem;margin-bottom:8px}
.ask-item{margin-bottom:8px}
.ask-item .ask-q{font-size:.78rem;color:var(--ink-2);font-weight:600;margin-bottom:2px}
.ask-item .ask-a{font-size:.8rem;color:var(--ink);background:var(--surface-hover);border-radius:var(--r-sm);padding:7px 10px;white-space:pre-wrap;word-break:break-word}
.why{margin-bottom:14px}
.why .wt{font-size:.82rem;font-weight:600;color:var(--ink);margin-bottom:6px}
.why textarea{width:100%;font-family:inherit;font-size:.85rem;padding:9px 11px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);min-height:64px;resize:vertical}
.why textarea:focus{outline:none;border-color:var(--accent);box-shadow:0 0 0 2px var(--accent-soft)}
.wb textarea{width:100%;font-family:inherit;font-size:.85rem;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r-sm);background:var(--surface);color:var(--ink);min-height:120px;resize:vertical;margin-bottom:10px}
.terms{display:none;margin-top:10px}
.chip{display:inline-block;font-size:.74rem;font-weight:600;background:var(--accent-soft);color:var(--accent);border-radius:99px;padding:3px 11px;margin:0 6px 6px 0}
.notice{background:var(--ok-soft);border:1px solid var(--ok);color:var(--ok);border-radius:var(--r-sm);padding:10px 14px;font-size:.82rem;font-weight:600;margin-bottom:14px}

.foot{display:flex;align-items:center;gap:12px;justify-content:space-between;position:sticky;bottom:0;background:var(--surface);border:1px solid var(--line-soft);border-radius:var(--r);box-shadow:var(--shadow-overlay);padding:12px 14px}
.foot .acc{flex:1;text-align:center;font-size:.82rem;color:var(--ink-2)}
.foot .acc b{color:var(--accent);font-size:1rem}

.result{text-align:center;padding:28px 8px 10px}
.result .r-ico{width:54px;height:54px;border-radius:99px;background:var(--ok-soft);color:var(--ok);display:grid;place-items:center;font-size:1.5rem;margin:0 auto 14px}
.result.warn .r-ico{background:var(--warn-soft);color:var(--warn)}
.result h2{font-family:var(--font-head);font-size:1.2rem;font-weight:700;margin-bottom:6px}
.result p{font-size:.86rem;color:var(--ink-2);margin-bottom:20px}
.result .actions{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}

.toast{position:fixed;left:50%;bottom:24px;transform:translate(-50%,20px);background:var(--ink);color:#fff;font-size:.82rem;font-weight:600;padding:9px 16px;border-radius:99px;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:100;box-shadow:var(--shadow-overlay)}
.toast.show{opacity:1;transform:translate(-50%,0)}
</style>
</head>
<body>
<header class="topbar">
  <div class="brand"><span class="logo">学</span>study<b>SupportAI</b></div>
  <nav class="nav">
    <a class="item active" href="home.html">マップ</a>
    <a class="item" href="materials.html">教材</a>
    <a class="item" href="stats.html">統計</a>
    <a class="item" href="settings.html">設定</a>
  </nav>
  <div class="spacer"></div>
  <button class="theme-btn" id="themeBtn" title="テーマ切替">
    <span class="sun">●</span><span class="moon">●</span>
  </button>
</header>

<div class="wrap">
  <div class="headcard">
    <div class="top">
      <a class="back" href="home.html">← マップへ</a>
      <span class="tag" id="hTag">ステージ</span>
      <span class="dd" id="hDay">DAY 1</span>
    </div>
    <h1 id="hName">ノード名</h1>
    <div class="sub" id="hSub"></div>
  </div>
  <div class="stepper" id="stepper"></div>
  <div class="card" id="card"></div>
  <div class="foot" id="foot"></div>
</div>

<div class="toast" id="toast"></div>
<script src="srs.js"></script>
<script src="quiz.js"></script>
<script>
const params=new URLSearchParams(location.search);
const NODE_ID=params.get('n')||'m1';
const DAY=parseInt(params.get('d')||'1',10);
let nodeInfo={name:'ノード',type:'discovery',zone:'A'};
try{
  const nodes=JSON.parse(localStorage.getItem('mapNodes')||'null');
  if(nodes){ const f=nodes.find(x=>x.id===NODE_ID); if(f) nodeInfo=f; }
}catch(e){}

const TYPE_LABEL={discovery:'発見',basic:'理解',practice:'演習',application:'応用',merge:'統合',boss:'ボス',gate:'診断'};
const STAGE_BADGE={discovery:'b-idle',basic:'b-idle',practice:'b-prog',application:'b-prog',merge:'b-ok',boss:'b-warn',gate:'b-warn'};



const Q=QUIZ[NODE_ID]||QUIZ_FALLBACK;
const qs=()=>Q.qs;

const WHY_REQUIRED=['merge','boss','application'];
const DO_WHY=WHY_REQUIRED.includes(nodeInfo.type)||Math.random()<0.35;
const steps=DAY===1
  ? (DO_WHY?['発見','理解チェック','なぜ3つ','白紙書き出し']:['発見','理解チェック','白紙書き出し'])
  : ['演習','誤答処理','クリア判定'];
let step=0;
const marks={check:{},drill:{},test:{}}, redoMarks={};

document.getElementById('hTag').textContent=(TYPE_LABEL[nodeInfo.type]||'ステージ')+'ステージ ・ '+(nodeInfo.zone==='A'?'光合成':'細胞分裂');
document.getElementById('hDay').textContent='DAY '+DAY;
document.getElementById('hName').textContent=nodeInfo.name;
document.getElementById('hSub').textContent=DAY===1
  ? 'わかる日: 発見 → 理解チェック → '+((DO_WHY?'なぜ3つ → ':''))+'白紙書き出し'
  : 'できる日: 演習 → 誤答処理 → クリア判定（正答率80%で緑）';

function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2200);
}
function navTo(name){ toast(name+'は未実装です（次のフェーズで作成予定）'); return false; }
document.getElementById('themeBtn').onclick=()=>{
  const h=document.documentElement;
  h.dataset.theme=h.dataset.theme==='dark'?'light':'dark';
  try{ localStorage.setItem('theme',h.dataset.theme); }catch(e){}
};

try{
  const t=localStorage.getItem('theme');
  if(t==='dark') document.documentElement.dataset.theme='dark';
}catch(e){}

function mark(base,qi,ok){
  marks[base][qi]=ok;
  const okB=document.getElementById(base+'m'+qi+'ok'), noB=document.getElementById(base+'m'+qi+'no');
  if(okB){ okB.classList.toggle('sel',ok); noB.classList.toggle('sel',!ok); }
  if(base==='test') updateAcc();
}
function reveal(base,qi){
  const inId=base==='w'?'wi'+qi:base+'i'+qi;
  const aId=base==='w'?'wa'+qi:base+'a'+qi;
  const el=document.getElementById(aId);
  el.textContent='→ '+qs()[qi].a;
  el.style.display='block';
  const inp=document.getElementById(inId);
  if(inp) inp.disabled=true;
  if(base!=='w') showAsk(base,qi);
}
function showAsk(base,qi){
  const box=document.getElementById(base+'ask'+qi);
  if(box&&box.style.display!=='block'){
    box.style.display='block';
    box.innerHTML=askBox(base,qi);
  }
}
function escapeHtml(s){
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}
let API_BASE='';
async function resolveApiBase(){
  if(API_BASE) return;
  try{
    const r=await fetch('/api/health',{signal:AbortSignal.timeout(1000)});
    if(r.ok){ API_BASE=''; return; }
  }catch(e){}
  const cands=['http://'+location.hostname+':8000','http://localhost:8000'];
  for(const c of cands){
    try{
      const r=await fetch(c+'/api/health',{signal:AbortSignal.timeout(1500)});
      if(r.ok){ API_BASE=c; return; }
    }catch(e){}
  }
  API_BASE=cands[0];
}
async function aiCall(path,body){
  const res=await fetch(API_BASE+'/api/ai/'+path,{
    method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body),
    signal:AbortSignal.timeout(60000),
  });
  if(!res.ok) throw new Error('http '+res.status);
  return res.json();
}
function setFeedback(base,qi,cls,html){
  const f=document.getElementById(base+'f'+qi);
  if(!f) return;
  f.className='feedback show '+cls;
  f.innerHTML=html;
}
async function aiGrade(base,qi){
  const inp=document.getElementById(base+'i'+qi);
  const userAnswer=inp?inp.value.trim():'';
  if(!userAnswer){ toast('先に答えを入力してください'); return; }
  setFeedback(base,qi,'busy','AI 判定中…');
  try{
    const d=await aiCall('grade',{question:qs()[qi].q,model_answer:qs()[qi].a,user_answer:userAnswer});
    mark(base,qi,!!d.correct);
    setFeedback(base,qi,d.correct?'ok':'no','AI判定: '+(d.correct?'○ 正解':'× 不正解')+'<br>'+escapeHtml(d.feedback||''));
    const a=document.getElementById(base+'a'+qi);
    if(a&&a.style.display!=='block') reveal(base,qi);
  }catch(e){
    setFeedback(base,qi,'no','AI に接続できませんでした。○/× で自分で判定してください。');
  }
}
const askHist={};
function askBox(base,qi){
  return '<div class="ak" id="'+base+'t'+qi+'"></div>'+
    '<div class="qrow"><input id="'+base+'q'+qi+'" placeholder="この回答について質問しよう"><button class="btn sm" onclick="ask(\''+base+'\','+qi+')">質問する</button></div>';
}
async function ask(base,qi){
  const inp=document.getElementById(base+'q'+qi);
  const q=inp.value.trim();
  if(!q){ toast('質問を入力してください'); return; }
  inp.value='';
  const key=base+':'+qi;
  const hist=(askHist[key]||[]).slice(-6);
  const th=document.getElementById(base+'t'+qi);
  const item=document.createElement('div');
  item.className='ask-item';
  const you=document.createElement('div'); you.className='ask-q'; you.textContent='質問: '+q;
  const ai=document.createElement('div'); ai.className='ask-a'; ai.textContent='考え中…';
  item.appendChild(you); item.appendChild(ai);
  th.appendChild(item);
  hist.push({role:'user',content:q});
  try{
    const d=await aiCall('tutor',{question:qs()[qi].q,model_answer:qs()[qi].a,user_answer:document.getElementById(base+'i'+qi).value||'',user_question:q,history:hist});
    ai.textContent='→ '+d.answer;
    hist.push({role:'assistant',content:d.answer});
    askHist[key]=hist;
  }catch(e){
    ai.textContent='→ AI に接続できませんでした。';
  }
}
function redomark(qi,ok){
  redoMarks[qi]=ok;
  const okB=document.getElementById('wm'+qi+'ok'), noB=document.getElementById('wm'+qi+'no');
  if(okB){ okB.classList.toggle('sel',ok); noB.classList.toggle('sel',!ok); }
}
function toggleTerms(){
  const el=document.getElementById('terms');
  if(el.textContent){
    el.textContent=''; el.style.display='none';
  }else{
    el.innerHTML=Q.terms.map(t=>'<span class="chip">'+t+'</span>').join('');
    el.style.display='block';
  }
}

function qBlock(base,qi,q){
  const okSel=marks[base][qi]===true?' sel':'', noSel=marks[base][qi]===false?' sel':'';
  return '<div class="q">'+
    '<div class="qt">Q'+(qi+1)+'. '+q.q+'</div>'+
    '<div class="qrow"><input id="'+base+'i'+qi+'" placeholder="答えを入力"><button class="btn sm" onclick="reveal(\''+base+'\','+qi+')">答えを表示</button>'+
    '<button class="btn sm ai" onclick="aiGrade(\''+base+'\','+qi+')">AIで判定</button></div>'+
    '<div class="ans" id="'+base+'a'+qi+'"></div>'+
    '<div class="feedback" id="'+base+'f'+qi+'"></div>'+
    '<div class="ask" id="'+base+'ask'+qi+'"></div>'+
    '<div class="mark">'+
      '<button class="mk ok'+okSel+'" id="'+base+'m'+qi+'ok" onclick="mark(\''+base+'\','+qi+',true)">○ 合ってた</button>'+
      '<button class="mk no'+noSel+'" id="'+base+'m'+qi+'no" onclick="mark(\''+base+'\','+qi+',false)">× 間違えた</button>'+
    '</div></div>';
}
function whyBlock(i,wt){
  return '<div class="why"><div class="wt">「'+wt+'」</div><textarea id="why'+i+'" placeholder="考えを書き出そう"></textarea></div>';
}
function wrongIndexes(){ return qs().map((q,i)=>(marks.drill[i]===false?i:-1)).filter(i=>i>=0); }

function cardHTML(s){
  const k=steps[s];
  if(k==='発見') return '<div class="sec-t">① 発見</div><p class="lead">下の解説を読んで、理解の土台を作りましょう。</p><div class="exp">'+Q.exp.replace(/\n/g,'<br>')+'</div><p class="tip">読み終えたら「次へ」を押してください。</p>';
  if(k==='理解チェック') return '<div class="sec-t">② 理解チェック</div><p class="lead">思い浮かんだ答えを入力し、答えを確認して ○/× で判定しましょう（AIで判定 も使えます）。</p>'+qs().slice(0,2).map((q,i)=>qBlock('check',i,q)).join('');
  if(k==='なぜ3つ') return '<div class="sec-t">③ なぜ3つ</div><p class="lead">3つの「なぜ」に答えて理解を深めましょう。頻度は抑えています。今回はスキップもできます。</p>'+
    whyBlock(0,'なぜこの考え方が大切なのか？')+whyBlock(1,'なぜそうなるのか？（仕組みや理由）')+whyBlock(2,'なぜミスしやすいのか？（自分の弱点はどこか）')+
    '<button class="btn sm" onclick="skipStep()">今回はスキップ</button>';
  if(k==='白紙書き出し') return '<div class="sec-t">④ 白紙書き出し</div><p class="lead">思い出せる限り書き出して、覚えていることを確認しましょう。見直し用にキーワードを見られます。</p>'+
    '<div class="wb"><textarea id="wb" placeholder="思い出せる限り、ここに書き出そう"></textarea>'+
    '<button class="btn sm" onclick="toggleTerms()">キーワードを見る</button><div class="terms" id="terms"></div></div>';
  if(k==='演習') return '<div class="sec-t">① 演習</div><p class="lead">問題を解いて ○/× で判定しましょう（AIで判定 も使えます）。</p>'+qs().map((q,i)=>qBlock('drill',i,q)).join('');
  if(k==='誤答処理'){
    const wrong=wrongIndexes();
    if(!wrong.length) return '<div class="sec-t">② 誤答処理</div><p class="lead">誤答なしです。そのまま判定へ進みましょう。</p><div class="notice">誤答ゼロ！次のステップへ</div>';
    return '<div class="sec-t">② 誤答処理</div><p class="lead">間違えた問題について「なぜ間違えたか」を書き、式を見ずに解き直しましょう。</p>'+
      wrong.map(qi=>{
        const okSel=redoMarks[qi]===true?' sel':'', noSel=redoMarks[qi]===false?' sel':'';
        return '<div class="q"><div class="qt">Q'+(qi+1)+'. '+qs()[qi].q+'</div>'+
          '<div class="ans" id="wa'+qi+'"></div>'+
          '<div class="why"><div class="wt">なぜ間違えたか？</div><textarea id="w'+qi+'" placeholder="間違えた理由を書き出そう"></textarea></div>'+
          '<div class="qrow"><input id="wi'+qi+'" placeholder="式を見ずに解き直そう"><button class="btn sm" onclick="reveal(\'w\','+qi+')">答えを表示</button></div>'+
          '<div class="mark">'+
            '<button class="mk ok'+okSel+'" id="wm'+qi+'ok" onclick="redomark('+qi+',true)">○ 解けた</button>'+
            '<button class="mk no'+noSel+'" id="wm'+qi+'no" onclick="redomark('+qi+',false)">× まだダメ</button>'+
          '</div></div>';
      }).join('');
  }
  return '<div class="sec-t">③ クリア判定</div><p class="lead">ミニテストです。○/× で判定すると正答率が自動で出ます（80%以上でクリア）。</p>'+qs().slice(0,Math.min(3,qs().length)).map((q,i)=>qBlock('test',i,q)).join('');
}

function updateAcc(){
  const el=document.getElementById('accV'); if(!el) return;
  const data=qs().slice(0,Math.min(3,qs().length));
  const marked=data.filter((_,i)=>marks.test[i]!==undefined).length;
  const ok=data.filter((_,i)=>marks.test[i]===true).length;
  el.textContent=marked?Math.round(ok/marked*100)+'%':'--';
}

function footHTML(s){
  const last=s===steps.length-1;
  const nextLabel=DAY===1?(last?'Day1 完了':'次へ'):(last?'判定する':'次へ');
  const acc=(DAY===2&&last)?'<div class="acc">正答率 <b id="accV">--</b></div>':'<div class="acc"></div>';
  return '<button class="btn" onclick="prev()"'+(s===0?' disabled':'')+'>← 前へ</button>'+acc+'<button class="btn primary" onclick="next()">'+nextLabel+'</button>';
}

function validate(s){
  const k=steps[s];
  if(k==='発見'||k==='白紙書き出し') return true;
  if(k==='理解チェック') return qs().slice(0,2).every((_,i)=>marks.check[i]!==undefined);
  if(k==='なぜ3つ'){ for(let i=0;i<3;i++){ const el=document.getElementById('why'+i); if(!el||!el.value.trim()) return false; } return true; }
  if(k==='演習') return qs().every((_,i)=>marks.drill[i]!==undefined);
  if(k==='誤答処理'){
    const wrong=wrongIndexes();
    if(!wrong.length) return true;
    return wrong.every(i=>redoMarks[i]!==undefined&&document.getElementById('w'+i).value.trim()!=='');
  }
  return qs().slice(0,Math.min(3,qs().length)).every((_,i)=>marks.test[i]!==undefined);
}
function skipStep(){
  steps.splice(step,1);
  if(!steps.length){ finish(); return; }
  if(step>=steps.length) step=steps.length-1;
render();
resolveApiBase();
}

function saveNodeState(id,st){
  try{
    const cur=JSON.parse(localStorage.getItem('mapState')||'{}');
    cur[id]=Object.assign({},cur[id],st);
    localStorage.setItem('mapState',JSON.stringify(cur));
  }catch(e){}
}
function resultCard(warn,title,sub,btns){
  document.getElementById('stepper').innerHTML='';
  document.getElementById('foot').innerHTML='';
  document.getElementById('card').innerHTML='<div class="result'+(warn?' warn':'')+'">'+
    '<div class="r-ico">◎</div><h2>'+title+'</h2><p>'+sub+'</p><div class="actions">'+btns.join('')+'</div></div>';
}

function finish(){
  if(DAY===1){
    saveNodeState(NODE_ID,{state:'in_progress',stars:0,day:1});
    resultCard(false,'Day1 完了！','「'+nodeInfo.name+'」の土台ができました。次の日で演習に取り組みましょう。',[
      '<a class="btn primary" href="study.html?n='+NODE_ID+'&d=2">Day2 へ進む</a>',
      '<a class="btn" href="home.html">マップへ戻る</a>']);
  }else{
    const data=qs().slice(0,Math.min(3,qs().length));
    const ok=data.filter((_,i)=>marks.test[i]===true).length;
    const acc=ok/data.length;
    if(acc>=0.8){
      const stars=acc>=0.95?3:(acc>=0.85?2:1);
      saveNodeState(NODE_ID,{state:'green',stars:stars,day:2});
      SRS.ensure(NODE_ID,qs().length,Math.min(2,qs().length));
      resultCard(false,'クリア！「'+nodeInfo.name+'」を緑にしました','正答率 '+Math.round(acc*100)+'% ・ 獲得スター '+('●'.repeat(stars))+'（'+stars+'）',[
        '<a class="btn" href="review.html?n='+NODE_ID+'">復習を始める</a>',
        '<a class="btn primary" href="home.html">マップへ戻る</a>']);
    }else{
      saveNodeState(NODE_ID,{state:'yellow',day:2});
      resultCard(true,'未達（正答率 '+Math.round(acc*100)+'%）','補強ブランチで弱点を固めましょう。',[
        '<a class="btn primary" href="study.html?n='+NODE_ID+'&d=1">補強ブランチへ</a>',
        '<a class="btn" href="home.html">マップへ戻る</a>']);
    }
  }
}

function next(){
  if(step>=steps.length) return;
  if(!validate(step)){ toast('すべて入力し、○/× で判定してください'); return; }
  if(step===steps.length-1){ finish(); return; }
  step++; render();
}
function prev(){ if(step>0){ step--; render(); } }

function render(){
  document.getElementById('stepper').innerHTML=steps.map((s,i)=>{
    const cls=i===step?'cur':(i<step?'done':'');
    return '<div class="step '+cls+'"><span class="sn">'+(i+1)+'</span><span class="sl">'+s+'</span></div>';
  }).join('');
  document.getElementById('card').innerHTML=cardHTML(step);
  document.getElementById('foot').innerHTML=footHTML(step);
}

render();
</script>
</body>
</html>
