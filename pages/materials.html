<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教材 | study_supportAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ui:'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,-apple-system,Meiryo,sans-serif;--font-head:'Space Grotesk','Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;--bg:#f4f5f7;--surface:#fff;--surface-hover:#f4f5f7;--surface-subtle:#fafbfc;--ink:#172b4d;--ink-2:#42526e;--ink-3:#6b778c;--line:#dfe1e6;--line-soft:#ebecf0;--accent:#0052cc;--accent-hover:#0747a6;--accent-focus:#4c9aff;--accent-soft:#e9f2ff;--ok:#00875a;--ok-soft:#e3fcef;--ng:#de350b;--ng-soft:#ffebe6;--warn:#ff8b00;--warn-soft:#fffae6;--violet:#6554c0;--violet-soft:#f0eeff;--link:#0052cc;--shadow-raised:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--shadow-overlay:0 12px 24px -6px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--r-sm:4px;--r:8px;--focus-ring:0 0 0 2px var(--accent-focus)}
[data-theme="dark"]{--bg:#161a1d;--surface:#22272b;--surface-hover:#282e33;--surface-subtle:#1c2125;--ink:#c7d1db;--ink-2:#9fadbc;--ink-3:#8993a4;--line:#454f59;--line-soft:#38414a;--accent:#579dff;--accent-hover:#85b8ff;--accent-focus:#579dff;--accent-soft:#1d2a44;--ok:#4bce97;--ok-soft:#164b35;--ng:#ff5630;--ng-soft:#4a1d15;--warn:#ffab00;--warn-soft:#4d3a0a;--violet:#9f8fef;--violet-soft:#352c63;--link:#579dff;--shadow-raised:0 1px 1px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.7);--shadow-overlay:0 12px 24px -6px rgba(0,0,0,.6),0 0 1px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700;flex-shrink:0}
.brand b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:4px}
.nav .item{color:var(--ink-2);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:var(--r-sm);transition:background .12s,color .12s}
.nav .item:hover{background:var(--surface-hover);color:var(--ink)}
.nav .item.active{color:var(--accent);background:var(--accent-soft)}
.topbar .spacer{flex:1}
@media(max-width:640px){.topbar{flex-wrap:wrap;gap:8px 16px}.nav{flex:1 1 100%;order:5;justify-content:center;padding:2px 0 0}}
.theme-btn{background:var(--surface-hover);border:1px solid var(--line-soft);color:var(--ink-2);width:34px;height:34px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s}
.theme-btn:hover{background:var(--line-soft);color:var(--ink)}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}
.pomo{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 12px;border-radius:99px;background:var(--surface-hover);border:1px solid var(--line-soft);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pomo .pt{font-variant-numeric:tabular-nums;color:var(--ink)}
.pomo .pb{width:26px;height:26px;border-radius:99px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:.74rem;display:grid;place-items:center;flex-shrink:0}
.streak{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;background:var(--surface-hover);border:1px solid var(--line-soft);font-size:.75rem;font-weight:700;color:var(--warn);white-space:nowrap}
.streak svg{flex-shrink:0}

.wrap{max-width:920px;margin:0 auto;padding:22px 20px 70px}
h1{font-family:var(--font-head);font-size:1.4rem;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:.86rem;margin-top:2px}
.sec{font-size:.72rem;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase;margin:24px 0 10px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:14px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-sm);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:var(--surface-subtle);color:var(--ink);transition:background .12s,color .12s}
.btn:hover{background:var(--surface-hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--ng-soft);color:var(--ng)}
.btn.sm{height:28px;padding:0 10px;font-size:.72rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
.linkbtn{background:none;border:none;color:var(--link);font-family:inherit;font-size:.78rem;font-weight:600;cursor:pointer;padding:2px 4px}
.linkbtn:hover{text-decoration:underline}
.linkbtn.danger{color:var(--ng)}
input[type="text"]{background:var(--surface-subtle);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;color:var(--ink);font-family:inherit;font-size:.82rem;transition:border-color .12s,background .12s}
input:focus{outline:none;border-color:var(--accent-focus);background:var(--surface)}
.inline{display:flex;gap:8px;align-items:center}

/* 科目カード */
.courses{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.course{background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;box-shadow:var(--shadow-raised);padding:12px 14px;cursor:pointer;transition:border-color .12s,box-shadow .12s}
.course:hover{border-color:var(--accent-focus);box-shadow:var(--shadow-overlay)}
.course .cn{font-weight:600;font-size:.88rem;display:flex;align-items:center;gap:8px}
.course .cn .em{width:26px;height:26px;border-radius:6px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.72rem;font-weight:700;flex-shrink:0}
.course .ct{font-size:.74rem;color:var(--ink-2);margin-top:4px}
.course .ops{margin-top:8px;display:flex;gap:8px}

/* エクスプローラ */
.crumb{display:flex;align-items:center;gap:6px;font-size:.8rem;font-weight:600;color:var(--ink-2);margin:16px 0 10px;flex-wrap:wrap}
.clink{background:none;border:none;color:var(--link);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;padding:2px 4px}
.clink:hover{text-decoration:underline}
.crumb .sep{color:var(--ink-3)}
.crumb .cpage{color:var(--ink);padding:2px 4px}
.frow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft);cursor:pointer}
.frow:last-child{border-bottom:none}
.frow:hover{background:var(--surface-hover)}
.frow .fico{width:38px;height:38px;border-radius:9px;background:var(--warn-soft);color:var(--warn);display:grid;place-items:center;flex-shrink:0}
.frow .fname{flex:1;min-width:0;font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.frow .fcount{font-size:.74rem;color:var(--ink-2);flex-shrink:0}
.frow .fops{display:flex;gap:6px;align-items:center;flex-shrink:0;opacity:0;transition:opacity .12s}
.frow:hover .fops{opacity:1}
@media(hover:none){.frow .fops{opacity:1}}

/* 教材リスト */
.list{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);overflow:hidden}
.mrow{display:flex;align-items:center;gap:12px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.mrow:last-child{border-bottom:none}
.mrow:hover{background:var(--surface-hover)}
.mrow .ico{width:38px;height:38px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-size:.78rem;font-weight:700;flex-shrink:0}
.mrow .bd{flex:1;min-width:0}
.mrow .nm{font-weight:600;font-size:.85rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center;gap:8px}
.mrow .meta{font-size:.72rem;color:var(--ink-2);margin-top:1px}
.mrow .acts{display:flex;gap:6px;align-items:center;flex-shrink:0}
.kbadge{display:inline-block;font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:99px;flex-shrink:0}
.kbadge.lecture{background:var(--accent-soft);color:var(--accent)}
.kbadge.past_exam{background:var(--violet-soft);color:var(--violet)}
.kbadge.test_info{background:var(--warn-soft);color:var(--warn)}
.kbadge.other{background:var(--surface-hover);color:var(--ink-2)}
.sbadge{display:inline-block;font-size:.62rem;font-weight:700;padding:1px 7px;border-radius:99px;flex-shrink:0}
.sbadge.idle{background:var(--surface-hover);color:var(--ink-2)}
.sbadge.proc{background:var(--warn-soft);color:var(--warn)}
.sbadge.ready{background:var(--ok-soft);color:var(--ok)}
.sbadge.error{background:var(--ng-soft);color:var(--ng)}
.empty{padding:22px;text-align:center;color:var(--ink-3);font-size:.8rem}
.note{margin-top:12px;background:var(--surface);border:1px dashed var(--line);border-radius:10px;padding:10px 14px;font-size:.76rem;color:var(--ink-2)}
.note code{background:var(--surface-subtle);border:1px solid var(--line-soft);border-radius:4px;padding:1px 5px;font-size:.72rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow-overlay);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">学</span>study<b>SupportAI</b></div>
  <nav class="nav">
    <a class="item" href="home.html">マップ</a>
    <a class="item active" href="materials.html">教材</a>
    <a class="item" href="stats.html">統計</a>
    <a class="item" href="settings.html">設定</a>
  </nav>
  <div class="spacer"></div>
  <div class="pomo" title="ポモドーロ（25分集中 / 5分休憩）">
    <span class="pt" id="pomoT">25:00</span>
    <button class="pb" id="pomoB" onclick="pomoToggle()" title="開始 / 停止">▶</button>
  </div>
  <div class="streak" title="継続日数">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 3-1.5 4.5-2.8 6C7.4 10 5.5 12 5.5 15a6.5 6.5 0 0 0 13 0c0-2.2-1.2-4-2.6-5.5.2 1.4-.3 2.4-1 3.2.2-3.5-1.6-6.6-2.9-8.2C11 3.5 11 2.7 12 2z"/></svg>
    継続 <b>12</b>日
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="テーマ切替" aria-label="テーマ切替">
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="wrap">
  <h1>教材・過去問</h1>
  <p class="sub">教材フォルダをエクスプローラーのように開いて、ファイルを教材として取り込んでいます。</p>

  <div class="bar">
    <button class="btn" onclick="rescan()">再スキャン</button>
    <button class="btn" onclick="location.href='settings.html'">教材フォルダを変更</button>
    <button class="btn" onclick="addCourse()">科目を追加</button>
    <input type="text" id="newCourse" placeholder="科目名（例: 理科）" style="display:none;width:180px">
  </div>

  <div class="note">教材フォルダ直下のファイル、および <code>&lt;科目フォルダ&gt;/&lt;ファイル&gt;</code> を教材として取り込みます。
    ファイル名を <code>2024_中間試験_…</code> とすると過去問（年度付き）として取り込みます。
    取り込みの詳細は <code>&lt;ファイル名&gt;.meta.json</code> でも指定できます。</div>

  <div class="crumb" id="crumb"></div>
  <div class="list" id="list"></div>
</main>

<div class="toast" id="toast"></div>
<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('errbar');
  if(!d){ d=document.createElement('div'); d.id='errbar'; d.style.cssText='position:fixed;left:0;right:0;top:0;background:#de350b;color:#fff;padding:8px 16px;z-index:99999;font-size:12px;font-family:monospace;white-space:pre-wrap'; document.body.appendChild(d); }
  d.textContent='JS エラー: '+(e.message||'')+(e.lineno?(' @ '+(e.filename||'').split('/').pop()+':'+e.lineno):'');
});

/* ============ テーマ・ポモドーロ・ナビ ============ */
function toggleTheme(){
  var r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  try{ localStorage.setItem('theme',r.dataset.theme); }catch(e){}
}
try{ document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'; }catch(e){}
let pomoLeft=25*60, pomoOn=false, pomoTimer=null;
function pomoFormat(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function updatePomo(){
  document.getElementById('pomoT').textContent=pomoFormat(pomoLeft);
  document.getElementById('pomoB').textContent=pomoOn?'■':'▶';
}
function pomoToggle(){
  pomoOn=!pomoOn;
  if(pomoOn){
    pomoTimer=setInterval(()=>{
      pomoLeft--;
      if(pomoLeft<=0){ pomoLeft=25*60; pomoOn=false; clearInterval(pomoTimer); }
      updatePomo();
    },1000);
  }else{ clearInterval(pomoTimer); }
  updatePomo();
}
function navTo(name){ alert(name+'は未実装です'); return false; }
updatePomo();

/* ============ API ============ */
let API_BASE='';
async function resolveApiBase(){
  if(API_BASE) return;
  try{
    const r=await fetch('/api/health',{signal:AbortSignal.timeout(1000)});
    if(r.ok){ API_BASE=''; return; }
  }catch(e){}
  const cands=['http://'+location.hostname+':8000','http://localhost:8000'];
  for(const c of cands){
    try{
      const r=await fetch(c+'/api/health',{signal:AbortSignal.timeout(1500)});
      if(r.ok){ API_BASE=c; return; }
    }catch(e){}
  }
  API_BASE=cands[0];
}
async function api(path,opts){
  opts=opts||{};
  await resolveApiBase();
  const res=await fetch(API_BASE+path,Object.assign({headers:{}},opts));
  if(!res.ok){ let msg='http '+res.status; try{ const j=await res.json(); msg=j.detail||msg; }catch(e){} throw new Error(msg); }
  const ct=res.headers.get('content-type')||'';
  return ct.indexOf('json')>=0?res.json():res.text();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }
function dstr(d){ const x=new Date(d); return x.getFullYear()+'/'+String(x.getMonth()+1).padStart(2,'0')+'/'+String(x.getDate()).padStart(2,'0'); }

/* ============ データ ============ */
const KIND_LABEL={lecture:'レジュメ',past_exam:'過去問',test_info:'テスト情報',other:'その他'};
const STATUS_LABEL={uploaded:'未OCR',processing:'処理中…',ready:'学習可能',error:'エラー'};
let courses=[], materials=[], cur=null;

function courseName(id){ const c=courses.find(x=>x.id===id); return c?c.name:''; }

async function loadAll(){
  await Promise.all([loadCourses(),loadMaterials()]);
  renderExplorer();
}
async function loadCourses(){
  courses=await api('/api/courses');
}
async function loadMaterials(){
  materials=await api('/api/materials');
}

/* ============ エクスプローラ描画 ============ */
const FOLDER_ICON='<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 19a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h5l2 3h9a2 2 0 0 1 2 2z"/></svg>';
function renderCrumb(){
  const rootBtn='<button class="clink" onclick="openRoot()">教材フォルダ</button>';
  document.getElementById('crumb').innerHTML=cur
    ? rootBtn+'<span class="sep">/</span><span class="cpage">'+esc(courseName(cur)||'…')+'</span>'
    : rootBtn;
}
function renderExplorer(){
  renderCrumb();
  const dirs=cur===null?courses:[];
  const files=cur===null?materials.filter(m=>m.course_id==null):materials.filter(m=>m.course_id===cur);
  const rows=
    dirs.map(c=>`<div class="frow" onclick="openFolder(${c.id})">
      <div class="fico">${FOLDER_ICON}</div>
      <div class="fname">${esc(c.name)}</div>
      <div class="fcount">${c.material_count} 件</div>
      <div class="fops">
        <button class="linkbtn" onclick="event.stopPropagation();renameCourse(${c.id})">リネーム</button>
        <button class="linkbtn danger" onclick="event.stopPropagation();delCourse(${c.id})">削除</button>
      </div></div>`).join('')+
    files.map(m=>{
      const kind=KIND_LABEL[m.kind]||m.kind;
      const kc=m.kind;
      const st=STATUS_LABEL[m.status]||m.status;
      const sc=m.status;
      const exam=(m.kind==='past_exam'&&(m.year||m.exam_type))?` ・ ${m.year} ${m.exam_type}`.trim():'';
      const loc=(cur===null)?esc(courseName(m.course_id)):'';
      const ocrBtn=(m.status==='uploaded')?'<button class="btn sm" onclick="startOcr('+m.id+')">OCR開始</button>':'';
      return `<div class="mrow">
        <div class="ico">${esc(m.title[0]||'?')}</div>
        <div class="bd">
          <div class="nm">${esc(m.title)}<span class="kbadge ${kc}">${kind}</span><span class="sbadge ${sc}">${st}</span></div>
          <div class="meta">${loc}${exam}</div>
        </div>
        <div class="acts">
          ${ocrBtn}
          <a class="linkbtn" href="material_view.html?m=${m.id}">開く</a>
          <button class="linkbtn danger" onclick="delMaterial(${m.id})">削除</button>
        </div></div>`;
    }).join('');
  document.getElementById('list').innerHTML=rows||'<div class="empty">この場所にファイルがありません。教材フォルダにファイルを置いて「再スキャン」してください。</div>';
}
function openFolder(id){ cur=id; renderExplorer(); }
function openRoot(){ cur=null; renderExplorer(); }

/* ============ 科目操作 ============ */
function addCourse(){
  const inp=document.getElementById('newCourse');
  if(inp.style.display==='none'){ inp.style.display='inline-block'; inp.focus(); return; }
  const name=inp.value.trim();
  if(!name){ toast('科目名を入力してください'); return; }
  api('/api/courses',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name})}).then(()=>{
    inp.value=''; inp.style.display='none'; toast('科目を追加しました'); loadCourses().then(renderExplorer);
  }).catch(e=>toast(e.message));
}
document.getElementById('newCourse').addEventListener('keydown',e=>{ if(e.key==='Enter') addCourse(); });
async function renameCourse(id){
  const c=courses.find(x=>x.id===id);
  const name=prompt('新しい科目名',c?c.name:'');
  if(name&&name.trim()&&name.trim()!==c.name){
    await api('/api/courses/'+id,{method:'PUT',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.trim()})});
    toast('科目名を変更しました'); await loadCourses(); renderExplorer();
  }
}
async function delCourse(id){
  if(!confirm('この科目を削除しますか？（教材も削除されます）')) return;
  await api('/api/courses/'+id,{method:'DELETE'});
  toast('科目を削除しました'); if(cur===id) cur=null; loadAll();
}

/* ============ 教材操作 ============ */
async function rescan(){
  const r=await api('/api/materials/scan',{method:'POST'});
  const n=(r.registered||[]).length;
  toast(n?`${n}件の新しい教材を取り込みました`:'新しいファイルはありませんでした');
  loadAll();
}
async function startOcr(id){
  await api('/api/materials/'+id+'/ocr',{method:'POST'});
  toast('OCR を開始しました');
  loadAll();
  setTimeout(()=>loadMaterials().then(renderExplorer),2500);
}
async function delMaterial(id){
  if(!confirm('この教材を削除しますか？')) return;
  await api('/api/materials/'+id,{method:'DELETE'});
  toast('削除しました'); loadAll();
}

loadAll();
</script>
