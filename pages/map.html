<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>マップ | study_supportAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ui:'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,-apple-system,Meiryo,sans-serif;--font-head:'Space Grotesk','Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;--bg:#f4f5f7;--surface:#fff;--surface-hover:#f4f5f7;--surface-subtle:#fafbfc;--ink:#172b4d;--ink-2:#42526e;--ink-3:#6b778c;--line:#dfe1e6;--line-soft:#ebecf0;--accent:#0052cc;--accent-hover:#0747a6;--accent-focus:#4c9aff;--accent-soft:#e9f2ff;--ok:#00875a;--ok-soft:#e3fcef;--ng:#de350b;--ng-soft:#ffebe6;--warn:#ff8b00;--warn-soft:#fffae6;--link:#0052cc;--shadow-raised:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--shadow-overlay:0 12px 24px -6px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--r-sm:4px;--r:8px}
[data-theme="dark"]{--bg:#161a1d;--surface:#22272b;--surface-hover:#282e33;--surface-subtle:#1c2125;--ink:#c7d1db;--ink-2:#9fadbc;--ink-3:#8993a4;--line:#454f59;--line-soft:#38414a;--accent:#579dff;--accent-hover:#85b8ff;--accent-focus:#579dff;--accent-soft:#1d2a44;--ok:#4bce97;--ok-soft:#164b35;--ng:#ff5630;--ng-soft:#4a1d15;--warn:#ffab00;--warn-soft:#4d3a0a;--link:#579dff;--shadow-raised:0 1px 1px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.7);--shadow-overlay:0 12px 24px -6px rgba(0,0,0,.6),0 0 1px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s;overflow:hidden;height:100vh;display:flex;flex-direction:column}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft);flex-shrink:0}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700;flex-shrink:0}
.brand b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:4px}
.nav .item{color:var(--ink-2);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:var(--r-sm);transition:background .12s,color .12s}
.nav .item:hover{background:var(--surface-hover);color:var(--ink)}
.nav .item.active{color:var(--accent);background:var(--accent-soft)}
.topbar .spacer{flex:1}
.theme-btn{background:var(--surface-hover);border:1px solid var(--line-soft);color:var(--ink-2);width:34px;height:34px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s}
.theme-btn:hover{background:var(--line-soft);color:var(--ink)}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}
@media(max-width:760px){.nav{display:none}}

/* ===== ヘッダー帯（今日のステージ・デッドライン） ===== */
.dash{display:flex;gap:16px;flex-wrap:wrap;align-items:center;padding:14px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft);flex-shrink:0}
.today{display:flex;align-items:center;gap:14px;flex:1;min-width:280px}
.today .tk{font-size:.7rem;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.today .nm{font-family:var(--font-head);font-weight:600;font-size:1rem}
.today .day{font-size:.78rem;color:var(--ink-2);margin-top:2px}
.today .go{color:var(--link);font-size:.8rem;font-weight:600;cursor:pointer;white-space:nowrap}
.today .go:hover{text-decoration:underline}
.prog{display:flex;align-items:center;gap:10px}
.prog .bar{width:140px;height:6px;border-radius:99px;background:var(--line-soft);overflow:hidden}
.prog .bar i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .4s}
.prog .lbl{font-size:.75rem;color:var(--ink-2);white-space:nowrap}
.dl{display:flex;align-items:center;gap:14px;font-size:.8rem;color:var(--ink-2);white-space:nowrap}
.dl .warn{color:var(--warn);font-weight:700}
.dl .ok{color:var(--ok);font-weight:700}
.dl .kv b{color:var(--ink)}

/* ===== 3D マップビューア（Canvas） ===== */
.viewport{position:relative;flex:1;overflow:hidden;background:
  radial-gradient(circle at 30% 20%, color-mix(in srgb,var(--accent) 7%, transparent), transparent 60%),
  radial-gradient(circle at 80% 80%, color-mix(in srgb,var(--ok) 5%, transparent), transparent 60%),
  var(--bg)}
.viewport .hint{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);font-size:.72rem;color:var(--ink-3);background:color-mix(in srgb,var(--surface) 80%,transparent);padding:4px 12px;border-radius:99px;border:1px solid var(--line-soft);z-index:8;white-space:nowrap}
.viewport canvas{position:absolute;inset:0;display:block;cursor:grab;touch-action:none}
.viewport canvas.dragging{cursor:grabbing}

/* ===== 詳細パネル ===== */
.panel{position:absolute;top:12px;right:12px;width:300px;background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-overlay);padding:16px;z-index:30;animation:slidein .22s ease}
@keyframes slidein{from{opacity:0;transform:translateX(16px)}to{opacity:1;transform:none}}
.panel .pk{font-size:.7rem;font-weight:700;color:var(--ink-3);letter-spacing:.08em;text-transform:uppercase}
.panel h3{font-family:var(--font-head);font-size:1.05rem;margin:2px 0 6px}
.panel .row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;font-size:.78rem;color:var(--ink-2);margin:4px 0}
.panel .desc{font-size:.8rem;color:var(--ink-2);margin:8px 0 12px}
.panel .mem{background:var(--accent-soft);border:1px solid color-mix(in srgb,var(--accent) 25%,transparent);border-radius:8px;padding:10px;font-size:.78rem;color:var(--ink-2);margin-bottom:12px}
.panel .mem .mk{font-weight:700;color:var(--accent);font-size:.68rem;letter-spacing:.06em;text-transform:uppercase;display:block;margin-bottom:3px}
.panel .actions{display:flex;flex-direction:column;gap:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-sm);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:var(--surface-subtle);color:var(--ink);transition:background .12s,box-shadow .12s}
.btn:hover{background:var(--surface-hover)}
.btn:active{background:var(--surface-hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--ng-soft);color:var(--ng)}
.btn.danger:hover{background:color-mix(in srgb,var(--ng-soft) 80%,var(--ng-soft))}
.btn.ghost{background:transparent;color:var(--ink-2)}
.btn.ghost:hover{background:var(--line-soft);color:var(--ink)}
.btn[disabled]{opacity:.5;cursor:not-allowed}

/* ===== ズームコントロール・凡例 ===== */
.zc{position:absolute;right:12px;bottom:14px;display:flex;flex-direction:column;gap:6px;z-index:30}
.zc .b{width:34px;height:34px;border-radius:8px;background:var(--surface);border:1px solid var(--line-soft);box-shadow:var(--shadow-raised);color:var(--ink-2);cursor:pointer;font-size:1rem;display:grid;place-items:center;transition:background .12s}
.zc .b:hover{background:var(--surface-hover);color:var(--ink)}
.legend{position:absolute;left:14px;bottom:44px;background:var(--surface);border:1px solid var(--line-soft);border-radius:10px;box-shadow:var(--shadow-raised);padding:10px 12px;font-size:.72rem;color:var(--ink-2);z-index:20;display:grid;grid-template-columns:auto auto;gap:4px 14px}
.legend .dot{width:10px;height:10px;border-radius:3px;display:inline-block;vertical-align:-1px;margin-right:6px}
.legend b{font-weight:600;color:var(--ink-2)}

/* トースト */
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow-overlay);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">学</span>study<b>SupportAI</b></div>
  <nav class="nav">
    <a class="item active" href="map.html">マップ</a>
    <a class="item" href="study.html">学習</a>
    <a class="item" href="materials.html">教材</a>
    <a class="item" href="settings.html">設定</a>
  </nav>
  <div class="spacer"></div>
  <button class="theme-btn" onclick="toggleTheme()" title="テーマ切替" aria-label="テーマ切替">
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<!-- 今日のステージ・進捗・デッドライン -->
<div class="dash">
  <div class="today">
    <div>
      <div class="tk">Today's Stage</div>
      <div class="nm" id="todayName">明反応の全体像</div>
      <div class="day" id="todayDay">Day 2 ・ 演習 → クリア判定 ・ 目標 2スター</div>
    </div>
    <div class="go" onclick="centerOn('m1')">マップの現在地へ →</div>
  </div>
  <div class="prog">
    <div class="bar"><i id="mapBar"></i></div>

  </div>
  <div class="dl" id="dl"></div>
</div>

<!-- 3D マップビューア -->
<div class="viewport" id="viewport">
  <div class="hint" id="hint">ドラッグで移動 ・ ホイールで拡大縮小 ・ ノードをクリックで詳細</div>
  <canvas id="cv"></canvas>

  <!-- 詳細パネル -->
  <div class="panel" id="panel" style="display:none;"></div>

  <div class="zc">
    <button class="b" onclick="zoomBy(1.25)" title="拡大">+</button>
    <button class="b" onclick="zoomBy(0.8)" title="縮小">−</button>
    <button class="b" onclick="resetView()" title="全体表示">⤢</button>
  </div>

  <div class="legend">
    <div><span class="dot" style="background:var(--ok)"></span><b>できる</b></div>
    <div><span class="dot" style="background:var(--warn)"></span><b>怪しい</b></div>
    <div><span class="dot" style="background:var(--ng)"></span><b>わからない</b></div>
    <div><span class="dot" style="background:var(--accent)"></span><b>進行中</b></div>
    <div><span class="dot" style="background:var(--line-soft)"></span><b>未着手</b></div>
    <div><span class="dot" style="background:transparent;border:1px dashed var(--line)"></span><b>ロック</b></div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
/* ============ テーマ ============ */
function toggleTheme(){
  var r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  readPalette();
}

/* ============ 定数 ============ */
const W=2000,H=1400,RX=52,PERSP=3000,YAW=-16;
const cg=Math.cos(YAW*Math.PI/180), sg=Math.sin(YAW*Math.PI/180);
const THICK=60,BOSS_THICK=84;
function TH(n){return n.type==='boss'?BOSS_THICK:THICK;}

/* ============ データ ============ */
const ZONES = [
  {name:'光合成',x:60,y:320,w:1400,h:740,locked:false},
  {name:'細胞分裂（未解放）',x:1480,y:320,w:570,h:740,locked:true},
];
const NODES = [
  /* ---- Zone A 光合成 ---- */
  {id:'d1',zone:'A',type:'discovery',name:'光合成とは',x:200,z:660,w:180,h:64,state:'green',stars:3},
  {id:'b1',zone:'A',type:'basic',name:'葉緑体の構造',x:420,z:370,w:170,h:64,state:'green',stars:2,from:['d1']},
  {id:'b4',zone:'A',type:'basic',name:'CO₂の固定',x:620,z:370,w:170,h:64,state:'unlocked',stars:0,from:['b1']},
  {id:'b2',zone:'A',type:'basic',name:'光エネルギーとATP',x:420,z:660,w:190,h:64,state:'green',stars:3,from:['d1']},
  {id:'b3',zone:'A',type:'basic',name:'水の分解と酸素',x:420,z:900,w:180,h:64,state:'yellow',stars:1,from:['d1']},
  {id:'br1',zone:'A',type:'branch',name:'水の分解ミニ（補強）',x:620,z:1010,w:190,h:58,state:'red',stars:0,from:['b3']},
  {id:'m1',zone:'A',type:'merge',name:'明反応の全体像',x:930,z:660,w:190,h:68,state:'in_progress',stars:0,day:2,from:['b2','b3','br1'],today:true},
  {id:'m2',zone:'A',type:'merge',name:'暗反応（カルビン回路）',x:1130,z:660,w:200,h:68,state:'locked',stars:0,from:['b1','b4','m1']},
  {id:'bossA',zone:'A',type:'boss',name:'光合成マスター',x:1340,z:900,w:200,h:72,state:'locked',stars:0,from:['m1','m2']},
  /* ---- Zone B 細胞分裂（ロック） ---- */
  {id:'d2',zone:'B',type:'discovery',name:'細胞分裂とは',x:1540,z:660,w:160,h:64,state:'locked'},
  {id:'b5',zone:'B',type:'basic',name:'体細胞分裂',x:1540,z:400,w:160,h:64,state:'locked',from:['d2']},
  {id:'b6',zone:'B',type:'basic',name:'減数分裂',x:1540,z:920,w:160,h:64,state:'locked',from:['d2']},
  {id:'m3',zone:'B',type:'merge',name:'細胞周期の流れ',x:1720,z:660,w:170,h:68,state:'locked',from:['b5','b6']},
  {id:'bossB',zone:'B',type:'boss',name:'細胞分裂マスター',x:1940,z:660,w:180,h:72,state:'locked',from:['m3']},
];

const STATE_LABEL = {green:'できる',yellow:'怪しい',red:'わからない',in_progress:'進行中',unlocked:'未着手',locked:'ロック'};
const TYPE_LABEL = {discovery:'発見',basic:'基礎',practice:'演習',merge:'合流',boss:'ボス',branch:'補強'};
const TYPE_DESC = {
  discovery:'教材を読んで概要をつかむ（インプットは最小限）。',
  basic:'単一概念の理解を確認する。短答・選択で答える。',
  practice:'反復練習で「できる」化する。量ベースで進める。',
  merge:'複数の要素を組み合わせる総合問題。前提ノードが全て必要。',
  boss:'章の総仕上げ。テスト形式・時間制限あり。診断ゲートを通過後に挑戦。',
  branch:'失敗を補強する代替ルート。要素分解・別アプローチ・暗記特化。',
};
const MEMO = {
  yellow:'AI提案: 「水の分解 → 酸素が発生」を“発泡スプレー”のイメージで。2H₂O → O₂ + 4H⁺ + 4e⁻ の「2→1酸素」を押さえると覚えやすい。',
  red:'AI提案: 水の分解は「光で水が割れる」とだけ覚える。化学式は補強後に暗記特化ブランチで反復。',
};

const nodeById = Object.fromEntries(NODES.map(n=>[n.id,n]));

/* ============ パレット（CSS変数を読み取り） ============ */
let P={};
function parseHex(h){
  h=String(h).replace('#','');
  if(h.length===3) h=h.split('').map(c=>c+c).join('');
  return [parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];
}
function rgba(h,a){const r=parseHex(h);return `rgba(${r[0]},${r[1]},${r[2]},${a})`;}
function mixh(a,b,t){const A=parseHex(a),B=parseHex(b);const f=i=>Math.round(A[i]+(B[i]-A[i])*t);return `rgb(${f(0)},${f(1)},${f(2)})`;}
function shade(h,f){const r=parseHex(h);if(isNaN(r[0]))return h;const c=v=>Math.max(0,Math.min(255,Math.round(v)));return `rgb(${c(r[0]*f)},${c(r[1]*f)},${c(r[2]*f)})`;}
function readPalette(){
  const gs=getComputedStyle(document.documentElement);
  const get=k=>gs.getPropertyValue(k).trim();
  P={
    bg:get('--bg'),surface:get('--surface'),ink:get('--ink'),ink2:get('--ink-2'),ink3:get('--ink-3'),
    line:get('--line'),lineSoft:get('--line-soft'),
    accent:get('--accent'),accentHover:get('--accent-hover'),accentFocus:get('--accent-focus'),accentSoft:get('--accent-soft'),
    ok:get('--ok'),okSoft:get('--ok-soft'),warn:get('--warn'),warnSoft:get('--warn-soft'),
    ng:get('--ng'),ngSoft:get('--ng-soft'),
  };
}
readPalette();

/* ============ カメラ・キャンバス ============ */
let scale=1,tx=0,ty=0;
let th=RX*Math.PI/180,sc=Math.cos(th),sw=Math.sin(th);
const viewport=document.getElementById('viewport');
const cv=document.getElementById('cv');
const ctx=cv.getContext('2d');
let vw=0,vh=0,dpr=1;
function resize(){
  dpr=Math.min(2,window.devicePixelRatio||1);
  vw=viewport.clientWidth; vh=viewport.clientHeight;
  cv.width=Math.max(1,Math.round(vw*dpr));
  cv.height=Math.max(1,Math.round(vh*dpr));
  cv.style.width=vw+'px'; cv.style.height=vh+'px';
}

function proj(x,y,z){
  const xc=x-W/2, zc=z-H/2;
  const xr=xc*cg+zc*sg, zr=-xc*sg+zc*cg;
  const y1=y*sc+zr*sw;
  const z1=-y*sw+zr*sc;
  const f=PERSP/(PERSP-z1);
  return {x:tx+xr*f*scale, y:ty+y1*f*scale, f:f};
}
function proj0(x,y,z,s){
  const xc=x-W/2, zc=z-H/2;
  const xr=xc*cg+zc*sg, zr=-xc*sg+zc*cg;
  const y1=y*sc+zr*sw;
  const z1=-y*sw+zr*sc;
  const f=PERSP/(PERSP-z1);
  return {x:xr*f*s, y:y1*f*s, f:f};
}
function camZ(x,y,z){
  const xc=x-W/2, zc=z-H/2;
  const zr=-xc*sg+zc*cg;
  return -y*sw+zr*sc;
}

function rr(x,y,w,h,r){
  r=Math.min(r,w/2,h/2);
  ctx.beginPath();
  ctx.moveTo(x+r,y);
  ctx.arcTo(x+w,y,x+w,y+h,r);
  ctx.arcTo(x+w,y+h,x,y+h,r);
  ctx.arcTo(x,y+h,x,y,r);
  ctx.arcTo(x,y,x+w,y,r);
  ctx.closePath();
}
function pointInQuad(px,py,a,b,c,d){
  const cr=(a,b)=>((b.x-a.x)*(py-a.y)-(b.y-a.y)*(px-a.x));
  const s1=cr(a,b),s2=cr(b,c),s3=cr(c,d),s4=cr(d,a);
  return (s1>=0&&s2>=0&&s3>=0&&s4>=0)||(s1<=0&&s2<=0&&s3<=0&&s4<=0);
}

/* ============ ノードの見た目 ============ */
function nodeStyle(n){
  const s={};
  if(n.state==='locked'){
    s.fill=mixh(P.ink,P.bg,0.75); s.border=mixh(P.ink,P.bg,0.55); s.borderW=1.5; s.dash=true;
    s.kicker=P.ink3; s.name=P.ink3; s.starOn=P.ink3; s.starOff=P.ink3; s.grad=false;
    return s;
  }
  if(n.type==='boss'){
    s.grad=true; s.fill=P.accent; s.border='transparent'; s.borderW=0;
    s.kicker='rgba(255,255,255,0.8)'; s.name='#ffffff';
    s.starOn='#ffffff'; s.starOff='rgba(255,255,255,0.45)';
    return s;
  }
  switch(n.state){
    case 'green': s.fill=P.okSoft; s.border=mixh(P.ok,P.line,0.55); break;
    case 'yellow': s.fill=P.warnSoft; s.border=mixh(P.warn,P.line,0.60); break;
    case 'red': s.fill=P.ngSoft; s.border=mixh(P.ng,P.line,0.55); break;
    case 'in_progress': s.fill=P.accentSoft; s.border=P.accent; break;
    default: s.fill=P.surface; s.border=P.line; break;
  }
  s.borderW=1.5; s.dash=false; s.grad=false;
  s.kicker=P.ink3; s.name=P.ink; s.starOn=P.accent; s.starOff=rgba(P.line,0.8);
  if(n.type==='branch'){ s.fill=P.warnSoft; s.border=P.warn; s.dash=true; s.kicker=P.warn; }
  if(n.type==='merge'){ s.border=P.accent; s.borderW=2; s.kicker=P.accent; }
  if(n.type==='discovery'){ s.border=P.accentFocus; }
  return s;
}
function badgeStyle(state){
  const m={
    green:[P.ok,'#fff'], yellow:[P.warn,'#fff'], red:[P.ng,'#fff'],
    in_progress:[P.accent,'#fff'], unlocked:[P.lineSoft,P.ink2],
  };
  const c=m[state]||[P.lineSoft,P.ink2];
  return {text:STATE_LABEL[state],bg:c[0],fg:c[1]};
}

/* ============ エッジ（直線クリップ） ============ */
function axisRange(d,start,center,ext){
  if(Math.abs(d)<1e-9) return (center-ext<=start&&start<=center+ext)?[0,1]:[NaN,NaN];
  const t1=(center-ext-start)/d, t2=(center+ext-start)/d;
  return [Math.min(t1,t2),Math.max(t1,t2)];
}
function edgeClip(a,b){
  const dx=b.x-a.x, dz=b.z-a.z, len=Math.hypot(dx,dz);
  if(len<1e-6) return null;
  const M=6;
  const rx=axisRange(dx,a.x,a.x,a.w/2), rz=axisRange(dz,a.z,a.z,a.h/2);
  const exitA=Math.min(rx[1],rz[1]);
  const bx=axisRange(dx,a.x,b.x,b.w/2), bz=axisRange(dz,a.z,b.z,b.h/2);
  const enterB=Math.max(bx[0],bz[0]);
  let t0=exitA+M/len, t1=enterB-M/len;
  if(t1<t0){const m=(t0+t1)/2;t0=m;t1=m;}
  if(t1<=0||t0>=1) return null;
  return {x0:a.x+dx*t0,z0:a.z+dz*t0,x1:a.x+dx*t1,z1:a.z+dz*t1};
}

/* ============ 描画 ============ */
let hoverId=null;

function wall(p0,p1,p2,p3,color){
  ctx.fillStyle=color;
  ctx.beginPath();
  ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.lineTo(p2.x,p2.y); ctx.lineTo(p3.x,p3.y);
  ctx.closePath();
  ctx.fill();
}
function wallShades(n){
  if(n.state==='locked') return [mixh(P.ink,P.bg,0.45), mixh(P.ink,P.bg,0.62)];
  if(n.type==='boss') return [shade(P.accentHover,0.7), P.accentHover];
  const m={green:[P.ok,P.okSoft],yellow:[P.warn,P.warnSoft],red:[P.ng,P.ngSoft],in_progress:[P.accent,P.accentSoft]};
  const c=m[n.state];
  if(c) return [mixh(c[0],c[1],0.15), mixh(c[0],c[1],0.38)];
  return [mixh(P.ink,P.surface,0.45), mixh(P.ink,P.surface,0.70)];
}

function drawZones(){
  ZONES.forEach(zo=>{
    const pts=[[zo.x,zo.y],[zo.x+zo.w,zo.y],[zo.x+zo.w,zo.y+zo.h],[zo.x,zo.y+zo.h]]
      .map(([x,z])=>proj(x,0,z));
    ctx.beginPath();
    ctx.moveTo(pts[0].x,pts[0].y);
    for(let i=1;i<4;i++) ctx.lineTo(pts[i].x,pts[i].y);
    ctx.closePath();
    ctx.fillStyle=rgba(zo.locked?P.ink:P.accent, zo.locked?0.02:0.04);
    ctx.fill();
    ctx.strokeStyle=P.line; ctx.lineWidth=1.5;
    ctx.setLineDash([7,7]); ctx.stroke(); ctx.setLineDash([]);
    /* ラベル */
    const nw=proj(zo.x,0,zo.y), ne=proj(zo.x+zo.w,0,zo.y), sw=proj(zo.x,0,zo.y+zo.h);
    const ux=(ne.x-nw.x)/zo.w, uy=(ne.y-nw.y)/zo.w;
    const vx=(sw.x-nw.x)/zo.h, vy=(sw.y-nw.y)/zo.h;
    ctx.save();
    ctx.transform(ux,uy,vx,vy,nw.x,nw.y);
    ctx.font='700 15px "Space Grotesk",Inter,sans-serif';
    ctx.fillStyle=rgba(P.ink3,zo.locked?0.7:1);
    ctx.textAlign='left'; ctx.textBaseline='alphabetic';
    let x=26;
    for(const ch of zo.name){ ctx.fillText(ch,x,44); x+=ctx.measureText(ch).width+1.5; }
    ctx.restore();
  });
}

function drawEdges(t){
  const list=[];
  NODES.forEach(n=>{
    if(!n.from) return;
    n.from.forEach(fid=>{
      const s=nodeById[fid]; if(!s) return;
      const e=edgeClip(s,n); if(!e) return;
      list.push({a:s,b:n,e,mz:camZ((e.x0+e.x1)/2,0,(e.z0+e.z1)/2)});
    });
  });
  list.sort((p,q)=>p.mz-q.mz);
  list.forEach(o=>{
    const p0=proj(o.e.x0,0,o.e.z0), p1=proj(o.e.x1,0,o.e.z1);
    const f=p0.f, ks=f*scale;
    ctx.save();
    if(o.a.state==='locked'||o.b.state==='locked'){
      ctx.strokeStyle=rgba(P.lineSoft,0.6);
      ctx.lineWidth=2*ks;
      ctx.setLineDash([5*ks,7*ks]);
    }else if(o.b.state==='in_progress'){
      ctx.strokeStyle=P.accent;
      ctx.lineWidth=3*ks;
      ctx.setLineDash([7*ks,9*ks]);
      ctx.lineDashOffset=-((t*16*ks)%(16*ks));
    }else{
      ctx.strokeStyle=rgba(P.accentFocus,0.65);
      ctx.lineWidth=2*ks;
      ctx.setLineDash([7*ks,9*ks]);
      ctx.lineDashOffset=-((t*16*ks)%(16*ks));
    }
    ctx.lineCap='round';
    ctx.beginPath(); ctx.moveTo(p0.x,p0.y); ctx.lineTo(p1.x,p1.y); ctx.stroke();
    ctx.restore();
  });
}

function drawCardContent(n,st,W_,H_){
  const padX=13;
  const metaBottom=H_-10, pillH=15;
  const metaTop=metaBottom-pillH;
  const nameBase=metaTop-2;
  let fs=(n.type==='boss')?15:14;
  ctx.font='600 '+fs+'px Inter,sans-serif';
  let nw=ctx.measureText(n.name).width;
  while(nw>(W_-2*padX)&&fs>9){ fs-=0.5; ctx.font='600 '+fs+'px Inter,sans-serif'; nw=ctx.measureText(n.name).width; }
  const kickBase=nameBase-4-fs;
  ctx.textAlign='left'; ctx.textBaseline='alphabetic';
  /* キッカー */
  ctx.font='700 9.5px Inter,sans-serif';
  ctx.fillStyle=st.kicker;
  let x=padX;
  for(const ch of TYPE_LABEL[n.type]){ ctx.fillText(ch,x,kickBase); x+=ctx.measureText(ch).width+1.1; }
  /* 名前 */
  ctx.font='600 '+fs+'px Inter,sans-serif';
  ctx.fillStyle=st.name;
  ctx.fillText(n.name,padX,nameBase);
  /* バッジ + スター */
  const b=badgeStyle(n.state);
  ctx.font='700 9px Inter,sans-serif';
  const tw=ctx.measureText(b.text).width;
  const pw=tw+12;
  rr(padX,metaTop,pw,pillH,pillH/2);
  ctx.fillStyle=b.bg; ctx.fill();
  ctx.fillStyle=b.fg;
  ctx.textAlign='center'; ctx.textBaseline='middle';
  ctx.fillText(b.text,padX+pw/2,metaBottom-pillH/2+0.5);
  ctx.textAlign='left';
  let sx=padX+pw+8; const sy=metaBottom-pillH/2+0.5;
  for(let i=0;i<3;i++){
    ctx.fillStyle=i<n.stars?st.starOn:st.starOff;
    ctx.fillText('●',sx,sy);
    sx+=ctx.measureText('●').width+2;
  }
}

function drawCard(n,nwT,neT,swT,st){
  const ux=(neT.x-nwT.x)/n.w, uy=(neT.y-nwT.y)/n.w;
  const vx=(swT.x-nwT.x)/n.h, vy=(swT.y-nwT.y)/n.h;
  const uLen=Math.hypot(ux,uy), vLen=Math.hypot(vx,vy);
  const av=(uLen+vLen)/2||1;
  const W_=n.w, H_=n.h, R=0;
  const now=performance.now();
  ctx.save();
  ctx.transform(ux,uy,vx,vy,nwT.x,nwT.y);
  ctx.lineJoin='round';
  /* カード本体（上面） */
  rr(0,0,W_,H_,R);
  if(st.grad){
    const g=ctx.createLinearGradient(0,0,0,H_);
    g.addColorStop(0,P.accent); g.addColorStop(1,P.accentHover);
    ctx.fillStyle=g;
  }else{
    ctx.fillStyle=st.fill;
  }
  ctx.fill();
  if(st.borderW>0){
    ctx.lineWidth=st.borderW/av;
    ctx.strokeStyle=st.border;
    if(st.dash) ctx.setLineDash([6/av,5/av]);
    ctx.stroke();
    ctx.setLineDash([]);
  }
  if(hoverId===n.id && n.state!=='locked'){
    rr(0,0,W_,H_,R);
    ctx.fillStyle='rgba(255,255,255,0.07)';
    ctx.fill();
  }
  /* in_progress パルス */
  if(n.state==='in_progress'){
    const p=(now/1800)%1, a=0.35*(1-p), off=p*10;
    rr(-off,-off,W_+2*off,H_+2*off,R+off);
    ctx.lineWidth=2.5/av; ctx.strokeStyle=rgba(P.accent,a); ctx.stroke();
  }
  /* 今日リング */
  if(n.today && n.state!=='locked'){
    rr(-3,-3,W_+6,H_+6,R+3);
    ctx.lineWidth=3/av; ctx.strokeStyle=rgba(P.accent,0.45); ctx.stroke();
  }
  /* 選択リング */
  if(selected===n.id){
    rr(-2,-2,W_+4,H_+4,R+2);
    ctx.lineWidth=3/av; ctx.strokeStyle=P.accentFocus; ctx.stroke();
  }
  /* 現在地リング */
  if(centeredId===n.id && now-centerT<1600){
    rr(-3,-3,W_+6,H_+6,R+3);
    ctx.lineWidth=2/av; ctx.strokeStyle=P.accentFocus;
    ctx.setLineDash([6/av,5/av]); ctx.stroke(); ctx.setLineDash([]);
  }
  /* 内容 */
  if(n.state==='locked'){
    ctx.font='700 22px Inter,sans-serif';
    ctx.textAlign='center'; ctx.textBaseline='middle';
    ctx.fillStyle=P.ink3;
    ctx.fillText('?',W_/2,H_/2);
  }else{
    drawCardContent(n,st,W_,H_);
  }
  ctx.restore();
}

function drawNode(n){
  const T=TH(n);
  const nw0=proj(n.x,0,n.z), ne0=proj(n.x+n.w,0,n.z);
  const sw0=proj(n.x,0,n.z+n.h), se0=proj(n.x+n.w,0,n.z+n.h);
  const nwT=proj(n.x,-T,n.z), neT=proj(n.x+n.w,-T,n.z);
  const swT=proj(n.x,-T,n.z+n.h), seT=proj(n.x+n.w,-T,n.z+n.h);
  const st=nodeStyle(n);
  const ws=wallShades(n);
  ctx.save();
  wall(ne0,se0,seT,neT,ws[1]);
  wall(sw0,se0,seT,swT,ws[0]);
  ctx.restore();
  drawCard(n,nwT,neT,swT,st);
}

function draw(){
  const now=performance.now();
  const t=now/1000;
  th=RX*Math.PI/180 + 0.8*Math.PI/180*Math.sin(now/1432);
  sc=Math.cos(th); sw=Math.sin(th);
  ctx.setTransform(dpr,0,0,dpr,0,0);
  /* 背景 */
  ctx.fillStyle=P.bg;
  ctx.fillRect(0,0,vw,vh);
  const g1=ctx.createRadialGradient(vw*0.3,vh*0.2,0,vw*0.3,vh*0.2,vw*0.6);
  g1.addColorStop(0,rgba(P.accent,0.07)); g1.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g1; ctx.fillRect(0,0,vw,vh);
  const g2=ctx.createRadialGradient(vw*0.8,vh*0.8,0,vw*0.8,vh*0.8,vw*0.6);
  g2.addColorStop(0,rgba(P.ok,0.05)); g2.addColorStop(1,'rgba(0,0,0,0)');
  ctx.fillStyle=g2; ctx.fillRect(0,0,vw,vh);

  drawZones();
  drawEdges(t);
  NODES.slice().sort((a,b)=>nodeDepth(a)-nodeDepth(b)).forEach(drawNode);
}
function nodeDepth(n){ return camZ(n.x+n.w/2, -TH(n)/2, n.z+n.h/2); }

function loop(){ draw(); requestAnimationFrame(loop); }

/* ============ ヒットテスト ============ */
function hitTest(mx,my){
  const order=NODES.slice().sort((a,b)=>nodeDepth(a)-nodeDepth(b));
  for(let i=order.length-1;i>=0;i--){
    const n=order[i], T=TH(n);
    const tl=proj(n.x,-T,n.z), tr=proj(n.x+n.w,-T,n.z);
    const br=proj(n.x+n.w,-T,n.z+n.h), bl=proj(n.x,-T,n.z+n.h);
    if(pointInQuad(mx,my,tl,tr,br,bl)) return n.id;
    const nw0=proj(n.x,0,n.z), ne0=proj(n.x+n.w,0,n.z), sw0=proj(n.x,0,n.z+n.h), se0=proj(n.x+n.w,0,n.z+n.h);
    const nwT=proj(n.x,-T,n.z), swT=proj(n.x,-T,n.z+n.h), seT=proj(n.x+n.w,-T,n.z+n.h);
    if(pointInQuad(mx,my,sw0,se0,seT,swT)) return n.id;
    if(pointInQuad(mx,my,ne0,se0,seT,neT)) return n.id;
  }
  return null;
}

/* ============ パン / ズーム ============ */
function zoomAt(f,pt){
  const nx=scale*f;
  if(nx<0.3||nx>3) return;
  const k=nx/scale;
  tx=pt.x-(pt.x-tx)*k;
  ty=pt.y-(pt.y-ty)*k;
  scale=nx;
}
function zoomBy(f){ zoomAt(f,{x:vw/2,y:vh/2}); }
function resetView(){
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity;
  const add=(x,y)=>{ if(x<minX)minX=x; if(x>maxX)maxX=x; if(y<minY)minY=y; if(y>maxY)maxY=y; };
  ZONES.forEach(zo=>{
    [[zo.x,zo.y],[zo.x+zo.w,zo.y],[zo.x,zo.y+zo.h],[zo.x+zo.w,zo.y+zo.h]]
      .forEach(([x,z])=>{ const p=proj0(x,0,z,1); add(p.x,p.y); });
  });
  NODES.forEach(n=>{
    const T=TH(n);
    [[n.x,n.z],[n.x+n.w,n.z],[n.x,n.z+n.h],[n.x+n.w,n.z+n.h]]
      .forEach(([x,z])=>{ const p=proj0(x,-T,z,1); add(p.x,p.y); });
  });
  const bw=maxX-minX, bh=maxY-minY;
  if(bw<=0||bh<=0) return;
  let ns=Math.min(vw/(bw*1.15), vh/(bh*1.15));
  ns=Math.max(0.3,Math.min(3,ns));
  scale=ns;
  tx=vw/2-(minX+maxX)/2*ns;
  ty=vh/2-(minY+maxY)/2*ns;
}
cv.addEventListener('wheel',e=>{
  e.preventDefault();
  const r=viewport.getBoundingClientRect();
  zoomAt(e.deltaY<0?1.1:0.9,{x:e.clientX-r.left,y:e.clientY-r.top});
},{passive:false});

let dragging=false,moved=false,sx=0,sy=0,stx=0,sty=0;
cv.addEventListener('pointerdown',e=>{
  dragging=true; moved=false; sx=e.clientX; sy=e.clientY; stx=tx; sty=ty;
  cv.setPointerCapture(e.pointerId);
});
cv.addEventListener('pointermove',e=>{
  const r=viewport.getBoundingClientRect();
  const mx=e.clientX-r.left, my=e.clientY-r.top;
  if(dragging){
    const dx=e.clientX-sx, dy=e.clientY-sy;
    if(Math.abs(dx)>3||Math.abs(dy)>3) moved=true;
    if(moved){ tx=stx+dx; ty=sty+dy; cv.classList.add('dragging'); }
  }else{
    hoverId=hitTest(mx,my);
    cv.style.cursor=hoverId?'pointer':'grab';
  }
});
cv.addEventListener('pointerup',e=>{
  if(!dragging) return;
  dragging=false;
  cv.classList.remove('dragging');
  if(!moved){
    const r=viewport.getBoundingClientRect();
    const mx=e.clientX-r.left, my=e.clientY-r.top;
    const id=hitTest(mx,my);
    if(id) selectNode(id);
    else { selected=null; document.getElementById('panel').style.display='none'; }
  }
});
cv.addEventListener('pointerleave',()=>{ hoverId=null; });
window.addEventListener('resize',resize);

/* ============ 現在地へ移動 ============ */
function centerOn(id){
  const n=nodeById[id];
  const T=TH(n);
  const c=proj0(n.x+n.w/2,-T,n.z+n.h/2,scale);
  tx=vw/2-c.x;
  ty=vh/2-c.y;
  centeredId=id; centerT=performance.now();
}

/* ============ 詳細パネル ============ */
let selected=null, centeredId=null, centerT=0;
function starsHTML(n){
  let s='';
  for(let i=0;i<3;i++) s+= i<n.stars ? '●':'<span class="off">●</span>';
  return s;
}
function badgeHTML(n){
  const map={green:'b-ok',yellow:'b-warn',red:'b-ng',in_progress:'b-prog',unlocked:'b-idle'};
  const c=map[n.state]||'b-idle';
  return `<span class="badge ${c}">${STATE_LABEL[n.state]}</span>`;
}
function selectNode(id){
  selected=id;
  const n=nodeById[id];
  const panel=document.getElementById('panel');
  const stateBadge=badgeHTML(n);
  let mem='';
  if(n.state==='yellow'||n.state==='red') mem=`<div class="mem"><span class="mk">AI 記憶術</span>${MEMO[n.state]||''}</div>`;
  if(n.state==='locked') mem=`<div class="mem"><span class="mk">解放条件</span>前提ノードを全てクリアすると解放されます。シルエットの内容は先の章で解放されます。</div>`;

  let actions='';
  if(n.state==='locked'){
    actions=`<button class="btn" disabled>前提ノードをクリアで解放</button>`;
  }else if(n.type==='boss'){
    actions=`<button class="btn primary" onclick="runGate('${n.id}')">診断ゲートを実行</button>
             <button class="btn" ${n.state!=='green'?'':'disabled'}>ボスに挑戦</button>`;
  }else if(n.state==='in_progress'){
    actions=`<button class="btn primary" onclick="toast('Day ${n.day||1} を続行')">Day ${n.day||1} を続行</button>
             <button class="btn danger" onclick="demote('${n.id}')">やめて後回し</button>`;
  }else if(n.state==='green'){
    actions=`<button class="btn danger" onclick="demote('${n.id}')">実は怪しい → 黄に降格</button>
             <button class="btn" onclick="toast('復習キューに追加（SRS）')">復習ステージへ</button>`;
  }else if(n.state==='yellow'||n.state==='red'){
    actions=`<button class="btn primary" onclick="toast('補強ブランチを開始')">補強ブランチを開始</button>
             <button class="btn" onclick="toast('再挑戦を開始')">再挑戦する</button>`;
  }else{
    actions=`<button class="btn primary" onclick="toast('Day 1 を開始')">Day 1 を開始</button>`;
  }

  panel.style.display='block';
  panel.innerHTML=`
    <div class="pk">${TYPE_LABEL[n.type]} ステージ ・ ${n.zone==='A'?'光合成':'細胞分裂'}</div>
    <h3>${n.name}</h3>
    <div class="row">${stateBadge}<span class="stars">${starsHTML(n)}</span></div>
    <div class="desc">${TYPE_DESC[n.type]}</div>
    ${mem}
    <div class="actions">${actions}</div>`;
}

/* ============ アクション ============ */
function demote(id){
  const n=nodeById[id];
  n.state='yellow';
  selected=null;
  document.getElementById('panel').style.display='none';
  updateStats();
  toast(`「${n.name}」を黄（怪しい）に降格しました。プランを再計算しました。`);
}
function runGate(id){
  selected=null;
  document.getElementById('panel').style.display='none';
  toast('診断ゲート実行中… 前提ノードから混合問題を生成します（モック）');
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._t);
  t._t=setTimeout(()=>t.classList.remove('show'),2200);
}

/* ============ 統計 ============ */
function updateStats(){
  const zoneA=NODES.filter(n=>n.zone==='A');
  const done=zoneA.filter(n=>n.state==='green').length;
  const total=zoneA.length;
  document.getElementById('mapBar').style.width=(done/total*100)+'%';
  document.getElementById('mapProg').textContent=`光合成 ${done}/${total} ノード`;
  const remaining=zoneA.filter(n=>n.state!=='green').length;
  const dl=document.getElementById('dl');
  dl.innerHTML=`<div class="kv">テストまで <b>14日</b></div><div class="kv">残り <b>${remaining}ノード</b></div><div class="kv">必要ペース <b>${(remaining/14).toFixed(1)}/日</b></div><div class="${remaining<=7?'ok':'warn'}">${remaining<=7?'計画通り':'やや遅れ'}</div>`;
}

/* ============ 初期化 ============ */
resize();
updateStats();
resetView();
document.getElementById('todayDay').textContent='Day 2 ・ 演習 → クリア判定 ・ 目標 ●●';
loop();
</script>
