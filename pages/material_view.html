<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教材詳細 | study_supportAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ui:'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,-apple-system,Meiryo,sans-serif;--font-head:'Space Grotesk','Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;--bg:#f4f5f7;--surface:#fff;--surface-hover:#f4f5f7;--surface-subtle:#fafbfc;--ink:#172b4d;--ink-2:#42526e;--ink-3:#6b778c;--line:#dfe1e6;--line-soft:#ebecf0;--accent:#0052cc;--accent-hover:#0747a6;--accent-focus:#4c9aff;--accent-soft:#e9f2ff;--ok:#00875a;--ok-soft:#e3fcef;--ng:#de350b;--ng-soft:#ffebe6;--warn:#ff8b00;--warn-soft:#fffae6;--violet:#6554c0;--violet-soft:#f0eeff;--link:#0052cc;--shadow-raised:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--shadow-overlay:0 12px 24px -6px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--r-sm:4px;--r:8px;--focus-ring:0 0 0 2px var(--accent-focus)}
[data-theme="dark"]{--bg:#161a1d;--surface:#22272b;--surface-hover:#282e33;--surface-subtle:#1c2125;--ink:#c7d1db;--ink-2:#9fadbc;--ink-3:#8993a4;--line:#454f59;--line-soft:#38414a;--accent:#579dff;--accent-hover:#85b8ff;--accent-focus:#579dff;--accent-soft:#1d2a44;--ok:#4bce97;--ok-soft:#164b35;--ng:#ff5630;--ng-soft:#4a1d15;--warn:#ffab00;--warn-soft:#4d3a0a;--violet:#9f8fef;--violet-soft:#352c63;--link:#579dff;--shadow-raised:0 1px 1px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.7);--shadow-overlay:0 12px 24px -6px rgba(0,0,0,.6),0 0 1px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.topbar{position:sticky;top:0;z-index:50;display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft)}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700;flex-shrink:0}
.brand b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:4px}
.nav .item{color:var(--ink-2);text-decoration:none;font-size:.85rem;font-weight:600;padding:6px 12px;border-radius:var(--r-sm);transition:background .12s,color .12s}
.nav .item:hover{background:var(--surface-hover);color:var(--ink)}
.nav .item.active{color:var(--accent);background:var(--accent-soft)}
.topbar .spacer{flex:1}
@media(max-width:640px){.topbar{flex-wrap:wrap;gap:8px 16px}.nav{flex:1 1 100%;order:5;justify-content:center;padding:2px 0 0}}
.theme-btn{background:var(--surface-hover);border:1px solid var(--line-soft);color:var(--ink-2);width:34px;height:34px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s}
.theme-btn:hover{background:var(--line-soft);color:var(--ink)}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}

.wrap{max-width:920px;margin:0 auto;padding:22px 20px 70px}
.back{color:var(--ink-2);text-decoration:none;font-size:.8rem;font-weight:600;display:inline-flex;align-items:center;gap:6px;margin-bottom:10px}
.back:hover{color:var(--accent)}
h1{font-family:var(--font-head);font-size:1.35rem;letter-spacing:-.01em;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sub{color:var(--ink-2);font-size:.85rem;margin-top:4px}
.kbadge{display:inline-block;font-size:.64rem;font-weight:700;padding:2px 9px;border-radius:99px;flex-shrink:0}
.kbadge.lecture{background:var(--accent-soft);color:var(--accent)}
.kbadge.past_exam{background:var(--violet-soft);color:var(--violet)}
.kbadge.test_info{background:var(--warn-soft);color:var(--warn)}
.kbadge.other{background:var(--surface-hover);color:var(--ink-2)}
.sbadge{display:inline-block;font-size:.64rem;font-weight:700;padding:2px 9px;border-radius:99px;flex-shrink:0}
.sbadge.idle{background:var(--surface-hover);color:var(--ink-2)}
.sbadge.proc{background:var(--warn-soft);color:var(--warn)}
.sbadge.ready{background:var(--ok-soft);color:var(--ok)}
.sbadge.error{background:var(--ng-soft);color:var(--ng)}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);margin-top:14px}
.card .hd{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 14px;border-bottom:1px solid var(--line-soft)}
.card .hd .tt{font-weight:600;font-size:.88rem;flex:1;min-width:140px}
.bar{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;height:34px;padding:0 14px;border-radius:var(--r-sm);font-family:inherit;font-size:.8rem;font-weight:600;cursor:pointer;border:1px solid transparent;background:var(--surface-subtle);color:var(--ink);transition:background .12s,color .12s}
.btn:hover{background:var(--surface-hover)}
.btn.primary{background:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-hover)}
.btn.danger{background:var(--ng-soft);color:var(--ng)}
.btn.sm{height:28px;padding:0 10px;font-size:.72rem}
.btn[disabled]{opacity:.5;cursor:not-allowed}
select,textarea,input[type="text"]{background:var(--surface-subtle);border:1px solid var(--line);border-radius:var(--r-sm);padding:7px 10px;color:var(--ink);font-family:inherit;font-size:.82rem;transition:border-color .12s,background .12s}
select:focus,textarea:focus,input:focus{outline:none;border-color:var(--accent-focus);background:var(--surface)}
.metaform{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:0 14px 12px}
.metaform label{font-size:.7rem;color:var(--ink-3);font-weight:600;margin-right:-4px}
.metaform select{width:118px}
.metaform input{width:150px}
.page{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);margin-top:14px;overflow:hidden}
.page .hd{display:flex;align-items:center;gap:10px;padding:11px 14px;border-bottom:1px solid var(--line-soft)}
.page .tt{font-weight:600;font-size:.85rem}
.page .st{margin-left:auto;font-size:.68rem;font-weight:600;color:var(--ink-3)}
.page .body{display:grid;grid-template-columns:minmax(0,5fr) minmax(0,6fr);gap:0}
.page .body .imgwrap{background:#0d0f12;display:grid;place-items:center;padding:12px}
.page .body img{max-width:100%;max-height:70vh;border-radius:6px;display:block}
.page .body .txtwrap{display:flex;flex-direction:column}
.page .body textarea{flex:1;border:none;border-left:1px solid var(--line-soft);border-radius:0;background:var(--surface-subtle);padding:14px;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;font-size:.78rem;line-height:1.7;resize:vertical;min-height:360px}
.page .body textarea:focus{background:var(--surface)}
.page .ft{display:flex;gap:8px;align-items:center;padding:9px 14px;border-top:1px solid var(--line-soft)}
.page .ft .hint{font-size:.68rem;color:var(--ink-3);flex:1}
@media(max-width:760px){.page .body{grid-template-columns:1fr}.page .body textarea{border-left:none;border-top:1px solid var(--line-soft)}}
.progress{height:6px;background:var(--line-soft);border-radius:99px;overflow:hidden;margin-top:12px}
.progress i{display:block;height:100%;background:var(--accent);border-radius:99px;transition:width .3s}
.txtlist{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);margin-top:14px;padding:16px;white-space:pre-wrap;font-size:.82rem;line-height:1.8}
.txtlist .ph{margin-top:14px;padding-top:14px;border-top:1px solid var(--line-soft)}
.txtlist .ph b{color:var(--ink-2);font-size:.7rem}
.toast{position:fixed;left:50%;bottom:22px;transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:.82rem;font-weight:600;box-shadow:var(--shadow-overlay);z-index:60;opacity:0;pointer-events:none;transition:opacity .25s,transform .25s}
.toast.show{opacity:1;transform:translateX(-50%) translateY(-4px)}
.switch{display:flex;gap:6px}
.switch .fchip{height:28px;padding:0 13px;border-radius:99px;border:1px solid var(--line);background:var(--surface);color:var(--ink-2);font-size:.76rem;font-weight:600;cursor:pointer;font-family:inherit}
.switch .fchip.active{background:var(--accent);border-color:var(--accent);color:#fff}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">学</span>study<b>SupportAI</b></div>
  <nav class="nav">
    <a class="item" href="home.html">マップ</a>
    <a class="item" href="materials.html">教材</a>
    <a class="item" href="stats.html">統計</a>
    <a class="item" href="settings.html">設定</a>
  </nav>
  <div class="spacer"></div>
  <button class="theme-btn" onclick="toggleTheme()" title="テーマ切替" aria-label="テーマ切替">
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="wrap">
  <a class="back" href="materials.html">← 教材一覧に戻る</a>
  <h1 id="title">読み込み中…</h1>
  <p class="sub" id="sub"></p>

  <div class="card">
    <div class="hd">
      <span class="tt">教材情報</span>
      <button class="btn" onclick="toggleMeta()" id="metaBtn">メタ情報を編集</button>
      <button class="btn primary" onclick="startOcr()" id="ocrBtn">OCR開始</button>
      <button class="btn danger" onclick="delMat()">削除</button>
    </div>
    <div class="metaform" id="metaform" style="display:none">
      <label>種別</label>
      <select id="mKind">
        <option value="lecture">レジュメ</option>
        <option value="past_exam">過去問</option>
        <option value="test_info">テスト情報</option>
        <option value="other">その他</option>
      </select>
      <label>年度</label>
      <input type="text" id="mYear" placeholder="2024">
      <label>試験名</label>
      <input type="text" id="mExam" placeholder="中間試験">
      <button class="btn primary sm" onclick="saveMeta()">保存</button>
    </div>
    <div class="progress" id="prog" style="display:none"><i id="progFill" style="width:0%"></i></div>
  </div>

  <div class="bar" style="margin-top:16px">
    <div class="switch">
      <button class="fchip active" id="swPage" onclick="setMode('page')">ページ表示</button>
      <button class="fchip" id="swText" onclick="setMode('text')">テキスト一覧</button>
    </div>
  </div>

  <div id="body"></div>
</main>

<div class="toast" id="toast"></div>
<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('errbar');
  if(!d){ d=document.createElement('div'); d.id='errbar'; d.style.cssText='position:fixed;left:0;right:0;top:0;background:#de350b;color:#fff;padding:8px 16px;z-index:99999;font-size:12px;font-family:monospace;white-space:pre-wrap'; document.body.appendChild(d); }
  d.textContent='JS エラー: '+(e.message||'')+(e.lineno?(' @ '+(e.filename||'').split('/').pop()+':'+e.lineno):'');
});

/* ============ テーマ・ナビ ============ */
function toggleTheme(){
  var r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  try{ localStorage.setItem('theme',r.dataset.theme); }catch(e){}
}
try{ document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'; }catch(e){}
function navTo(name){ alert(name+'は未実装です'); return false; }

/* ============ API ============ */
let API_BASE='';
async function resolveApiBase(){
  if(API_BASE) return;
  try{
    const r=await fetch('/api/health',{signal:AbortSignal.timeout(1000)});
    if(r.ok){ API_BASE=''; return; }
  }catch(e){}
  const cands=['http://'+location.hostname+':8000','http://localhost:8000'];
  for(const c of cands){
    try{
      const r=await fetch(c+'/api/health',{signal:AbortSignal.timeout(1500)});
      if(r.ok){ API_BASE=c; return; }
    }catch(e){}
  }
  API_BASE=cands[0];
}
async function api(path,opts){
  opts=opts||{};
  await resolveApiBase();
  const res=await fetch(API_BASE+path,Object.assign({headers:{}},opts));
  if(!res.ok){ let msg='http '+res.status; try{ const j=await res.json(); msg=j.detail||msg; }catch(e){} throw new Error(msg); }
  const ct=res.headers.get('content-type')||'';
  return ct.indexOf('json')>=0?res.json():res.text();
}
function toast(msg){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400);
}
function esc(s){ return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;'); }

/* ============ 状態 ============ */
const KIND_LABEL={lecture:'レジュメ',past_exam:'過去問',test_info:'テスト情報',other:'その他'};
const STATUS_LABEL={uploaded:'未OCR',processing:'処理中…',ready:'学習可能',error:'エラー'};
let mat=null, courses=[], mode='page', pollTimer=null;

function param(name){
  return new URLSearchParams(location.search).get(name);
}

async function load(){
  const id=param('m');
  if(!id){ document.getElementById('body').innerHTML='<div class="card"><div class="hd">教材IDが指定されていません。</div></div>'; return; }
  try{
    courses=await api('/api/courses');
    mat=await api('/api/materials/'+id);
  }catch(e){
    document.getElementById('title').textContent='読み込み失敗';
    document.getElementById('body').innerHTML='<div class="card"><div class="hd">'+(e.message)+'</div></div>';
    return;
  }
  render();
  if(mat.status==='processing') startPoll();
}
function render(){
  const cn=(courses.find(c=>c.id===mat.course_id)||{}).name||'';
  document.getElementById('title').innerHTML=esc(mat.title)+
    `<span class="kbadge ${mat.kind}">${KIND_LABEL[mat.kind]||mat.kind}</span>`+
    `<span class="sbadge ${mat.status}">${STATUS_LABEL[mat.status]||mat.status}</span>`;
  document.getElementById('sub').textContent=
    [cn, mat.year, mat.exam_type, (mat.pages||[]).length+'ページ', '作成 '+mat.created_at.split('T')[0]].filter(Boolean).join(' ・ ');
  document.getElementById('mKind').value=mat.kind;
  document.getElementById('mYear').value=mat.year||'';
  document.getElementById('mExam').value=mat.exam_type||'';
  document.getElementById('ocrBtn').disabled=(mat.status==='processing'||mat.status==='ready');
  document.getElementById('ocrBtn').textContent=mat.status==='processing'?'OCR処理中…':'OCR開始';
  document.getElementById('prog').style.display=(mat.status==='processing')?'block':'none';
  renderMode();
}
function renderMode(){
  const b=document.getElementById('body');
  if(mode==='text'){ b.innerHTML=renderTextList(); }
  else{ b.innerHTML=renderPages(); }
}
function renderPages(){
  return (mat.pages||[]).map(p=>{
    const img=(p.has_image)?`<div class="imgwrap"><img src="${API_BASE}/api/materials/${mat.id}/pages/${p.page_no}/image" alt="page ${p.page_no}"></div>`:'';
    const done=document.getElementById('p_'+p.id);
    return `<div class="page">
      <div class="hd"><span class="tt">ページ ${p.page_no}</span><span class="st">${p.status==='done'?'済':(p.status==='processing'?'処理中…':(p.status==='error'?'エラー':'未処理'))}</span></div>
      <div class="body">${img}<div class="txtwrap"><textarea id="p_${p.id}" spellcheck="false">${esc(p.ocr_text||'')}</textarea></div></div>
      <div class="ft">
        <span class="hint">OCR テキストは編集できます</span>
        <button class="btn sm" onclick="savePage(${p.id})">保存</button>
        <button class="btn sm" onclick="reOcr(${p.id})">このページを再OCR</button>
      </div></div>`;
  }).join('')||'<div class="card"><div class="hd">ページがありません。</div></div>';
}
function renderTextList(){
  return `<div class="txtlist">${(mat.pages||[]).map(p=>
    `<div class="ph"><b>ページ ${p.page_no}</b>\n${esc(p.ocr_text||'')}</div>`).join('')}</div>`||'<div class="card"><div class="hd">ページがありません。</div></div>';
}
function setMode(m){
  mode=m;
  document.getElementById('swPage').classList.toggle('active',m==='page');
  document.getElementById('swText').classList.toggle('active',m==='text');
  renderMode();
}

/* ============ 操作 ============ */
function toggleMeta(){
  const f=document.getElementById('metaform');
  const show=f.style.display==='none';
  f.style.display=show?'flex':'none';
  document.getElementById('metaBtn').textContent=show?'閉じる':'メタ情報を編集';
}
async function saveMeta(){
  try{
    mat=await api('/api/materials/'+mat.id+'/meta',{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({kind:document.getElementById('mKind').value,title:mat.title,
        year:document.getElementById('mYear').value.trim(),exam_type:document.getElementById('mExam').value.trim()})});
    document.getElementById('metaform').style.display='none';
    document.getElementById('metaBtn').textContent='メタ情報を編集';
    toast('メタ情報を保存しました'); render();
  }catch(e){ toast(e.message); }
}
async function startOcr(){
  try{
    await api('/api/materials/'+mat.id+'/ocr',{method:'POST'});
    toast('OCR を開始しました'); mat.status='processing'; render(); startPoll();
  }catch(e){ toast(e.message); }
}
function startPoll(){
  clearInterval(pollTimer);
  pollTimer=setInterval(async()=>{
    try{
      const st=await api('/api/materials/'+mat.id+'/status');
      document.getElementById('prog').style.display='block';
      const pct=Math.round((st.progress||0)*100);
      document.getElementById('progFill').style.width=pct+'%';
      if(st.material_status!=='processing'){
        clearInterval(pollTimer);
        mat=await api('/api/materials/'+mat.id);
        render(); toast('OCR が完了しました');
      }
    }catch(e){}
  },1500);
}
async function savePage(pid){
  try{
    await api('/api/materials/pages/'+pid,{method:'PUT',headers:{'Content-Type':'application/json'},
      body:JSON.stringify({ocr_text:document.getElementById('p_'+pid).value})});
    toast('保存しました');
  }catch(e){ toast(e.message); }
}
async function reOcr(pid){
  try{
    await api('/api/materials/pages/'+pid+'/reocr',{method:'POST'});
    const np=await api('/api/materials/pages/'+pid);
    const idx=mat.pages.findIndex(p=>p.id===pid);
    if(idx>=0) mat.pages[idx]=np;
    toast('再OCR を実行しました'); renderMode();
  }catch(e){ toast(e.message); }
}
async function delMat(){
  if(!confirm('この教材を削除しますか？')) return;
  try{
    await api('/api/materials/'+mat.id,{method:'DELETE'});
    location.href='materials.html';
  }catch(e){ toast(e.message); }
}

load();
</script>
</body>
</html>
