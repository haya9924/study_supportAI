<!DOCTYPE html>
<html lang="ja" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>統計・チェックリスト | study_supportAI</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Space+Grotesk:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--font-ui:'Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',system-ui,-apple-system,Meiryo,sans-serif;--font-head:'Space Grotesk','Inter','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif;--bg:#f4f5f7;--surface:#fff;--surface-hover:#f4f5f7;--surface-subtle:#fafbfc;--ink:#172b4d;--ink-2:#42526e;--ink-3:#6b778c;--line:#dfe1e6;--line-soft:#ebecf0;--accent:#0052cc;--accent-hover:#0747a6;--accent-focus:#4c9aff;--accent-soft:#e9f2ff;--ok:#00875a;--ok-soft:#e3fcef;--ng:#de350b;--ng-soft:#ffebe6;--warn:#ff8b00;--warn-soft:#fffae6;--violet:#6554c0;--violet-soft:#f0eeff;--link:#0052cc;--shadow-raised:0 1px 1px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--shadow-overlay:0 12px 24px -6px rgba(9,30,66,.25),0 0 1px rgba(9,30,66,.31);--r-sm:4px;--r:8px}
[data-theme="dark"]{--bg:#161a1d;--surface:#22272b;--surface-hover:#282e33;--surface-subtle:#1c2125;--ink:#c7d1db;--ink-2:#9fadbc;--ink-3:#8993a4;--line:#454f59;--line-soft:#38414a;--accent:#579dff;--accent-hover:#85b8ff;--accent-focus:#579dff;--accent-soft:#1d2a44;--ok:#4bce97;--ok-soft:#164b35;--ng:#ff5630;--ng-soft:#4a1d15;--warn:#ffab00;--warn-soft:#4d3a0a;--violet:#9f8fef;--violet-soft:#352c63;--link:#579dff;--shadow-raised:0 1px 1px rgba(0,0,0,.4),0 0 1px rgba(0,0,0,.7);--shadow-overlay:0 12px 24px -6px rgba(0,0,0,.6),0 0 1px rgba(0,0,0,.7)}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:var(--font-ui);background:var(--bg);color:var(--ink);font-size:14px;line-height:1.6;-webkit-font-smoothing:antialiased;transition:background .2s,color .2s}
.topbar{display:flex;align-items:center;gap:16px;padding:10px 20px;background:var(--surface);border-bottom:1px solid var(--line-soft);position:sticky;top:0;z-index:50}
.brand{font-family:var(--font-head);font-weight:700;font-size:1.05rem;letter-spacing:-.01em;display:flex;align-items:center;gap:8px;white-space:nowrap}
.brand .logo{width:28px;height:28px;border-radius:6px;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:.85rem;font-weight:700;flex-shrink:0}
.brand b{color:var(--accent);font-weight:700}
.nav{display:flex;gap:2px;overflow-x:auto}
.nav .item{color:var(--ink-2);text-decoration:none;font-size:.82rem;font-weight:600;padding:6px 11px;border-radius:var(--r-sm);transition:background .12s,color .12s;white-space:nowrap;cursor:pointer;border:none;background:transparent;font-family:inherit}
.nav .item:hover{background:var(--surface-hover);color:var(--ink)}
.nav .item.active{color:var(--accent);background:var(--accent-soft)}
.topbar .spacer{flex:1}
@media(max-width:640px){.topbar{flex-wrap:wrap;gap:8px 16px}.nav{flex:1 1 100%;order:5;justify-content:center;padding:2px 0 0}}
.streak{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 11px;border-radius:99px;background:var(--surface-hover);border:1px solid var(--line-soft);font-size:.75rem;font-weight:700;color:var(--warn);white-space:nowrap}
.streak svg{flex-shrink:0}
.theme-btn{background:var(--surface-hover);border:1px solid var(--line-soft);color:var(--ink-2);width:34px;height:34px;border-radius:var(--r-sm);cursor:pointer;display:grid;place-items:center;transition:background .12s,color .12s}
.theme-btn:hover{background:var(--line-soft);color:var(--ink)}
.theme-btn .moon{display:none}
[data-theme="dark"] .theme-btn .sun{display:none}
[data-theme="dark"] .theme-btn .moon{display:block}
.pomo{display:inline-flex;align-items:center;gap:8px;height:30px;padding:0 4px 0 12px;border-radius:99px;background:var(--surface-hover);border:1px solid var(--line-soft);font-size:.75rem;font-weight:700;color:var(--ink-2);white-space:nowrap}
.pomo .pt{font-variant-numeric:tabular-nums;color:var(--ink)}
.pomo .pb{width:26px;height:26px;border-radius:99px;background:var(--accent);color:#fff;border:none;cursor:pointer;font-size:.74rem;display:grid;place-items:center;flex-shrink:0;transition:background .12s}
.pomo .pb:hover{background:var(--accent-hover)}

.wrap{max-width:960px;margin:0 auto;padding:22px 20px 60px}
h2.sec{font-family:var(--font-head);font-size:1rem;margin:26px 0 12px;letter-spacing:.02em}
h2.sec:first-child{margin-top:0}

/* 概要カード */
.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px}
.card{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);padding:14px 16px}
.card b{display:block;font-family:var(--font-head);font-size:1.5rem;color:var(--accent);line-height:1.2}
.card b.ok{color:var(--ok)}
.card b.warn{color:var(--warn)}
.card span{font-size:.7rem;color:var(--ink-3);letter-spacing:.05em}
.card .sub{font-size:.72rem;color:var(--ink-2);margin-top:2px}

/* 進捗バー */
.pbar{height:10px;border-radius:99px;background:var(--line-soft);overflow:hidden;margin:10px 0 4px}
.pbar i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--ok));border-radius:99px;transition:width .4s}

/* ノード進捗表 */
.grid{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);overflow:hidden}
.grow{display:flex;align-items:center;gap:10px;padding:9px 14px;border-bottom:1px solid var(--line-soft)}
.grow:last-child{border-bottom:none}
.grow .nm{flex:1;min-width:0;font-size:.82rem;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.grow .ty{font-size:.66rem;color:var(--ink-3);flex-shrink:0}
.grow .stars{color:var(--warn);font-size:.68rem;flex-shrink:0;letter-spacing:1px}
.badge{display:inline-flex;align-items:center;height:19px;padding:0 8px;border-radius:99px;font-size:.66rem;font-weight:700;flex-shrink:0}
.badge.b-ok{background:var(--ok);color:#fff}.badge.b-warn{background:var(--warn);color:#fff}.badge.b-ng{background:var(--ng);color:#fff}
.badge.b-prog{background:var(--accent);color:#fff}.badge.b-idle{background:var(--line-soft);color:var(--ink-2)}
.badge.b-gate{background:var(--violet);color:#fff}
.srs{font-size:.7rem;color:var(--ink-2);flex-shrink:0;white-space:nowrap}
.srs b{color:var(--ink)}

/* チェックリスト */
.cl{background:var(--surface);border:1px solid var(--line-soft);border-radius:12px;box-shadow:var(--shadow-raised);padding:6px 6px}
.cl .clh{display:flex;align-items:center;gap:10px;padding:10px 12px 8px;font-family:var(--font-head);font-size:.9rem}
.cl .clh .cn{margin-left:auto;font-size:.72rem;color:var(--ink-3)}
.cl .clh .cn b{color:var(--accent)}
.clitem{display:flex;align-items:center;gap:10px;padding:8px 12px;border-radius:8px;cursor:pointer;font-size:.8rem;transition:background .12s}
.clitem:hover{background:var(--surface-hover)}
.clitem.off{color:var(--ink-3);text-decoration:line-through}
.clitem .ck{width:18px;height:18px;border-radius:5px;border:1.5px solid var(--line);flex-shrink:0;display:grid;place-items:center;font-size:.62rem;color:transparent;transition:all .12s}
.clitem.on .ck{background:var(--ok);border-color:var(--ok);color:#fff}
.hint{font-size:.74rem;color:var(--ink-3);margin-top:10px;text-align:center}
</style>
</head>
<body>

<header class="topbar">
  <div class="brand"><span class="logo">学</span>study<b>SupportAI</b></div>
  <nav class="nav">
    <a class="item" href="home.html">マップ</a>
    <a class="item" href="materials.html">教材</a>
    <a class="item active" href="stats.html">統計</a>
    <a class="item" href="settings.html">設定</a>
  </nav>
  <div class="spacer"></div>
  <div class="pomo" title="ポモドーロ（25分集中 / 5分休憩）">
    <span class="pt" id="pomoT">25:00</span>
    <button class="pb" id="pomoB" onclick="pomoToggle()" title="開始 / 停止">▶</button>
  </div>
  <div class="streak" title="継続日数">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2c.5 3-1.5 4.5-2.8 6C7.4 10 5.5 12 5.5 15a6.5 6.5 0 0 0 13 0c0-2.2-1.2-4-2.6-5.5.2 1.4-.3 2.4-1 3.2.2-3.5-1.6-6.6-2.9-8.2C11 3.5 11 2.7 12 2z"/></svg>
    継続 <b id="streak">12</b>日
  </div>
  <button class="theme-btn" onclick="toggleTheme()" title="テーマ切替" aria-label="テーマ切替">
    <svg class="sun" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
    <svg class="moon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8z"/></svg>
  </button>
</header>

<main class="wrap">
  <h2 class="sec">概要</h2>
  <div class="pbar"><i id="cardBar" style="width:0%"></i></div>
  <div class="cards" id="cards"></div>

  <h2 class="sec">ノード別進捗</h2>
  <div class="grid" id="nodeGrid"></div>

  <h2 class="sec">復習（SRS）統計</h2>
  <div class="cards" id="srsCards"></div>

  <h2 class="sec">チェックリスト</h2>
  <div class="cl">
    <div class="clh">毎日 <span class="cn"><b id="cDaily">0/0</b></span></div>
    <div id="clDaily"></div>
  </div>
  <div class="cl" style="margin-top:12px">
    <div class="clh">週1 <span class="cn"><b id="cWeekly">0/0</b></span></div>
    <div id="clWeekly"></div>
  </div>
  <div class="cl" style="margin-top:12px">
    <div class="clh">テスト直前 <span class="cn"><b id="cExam">0/0</b></span></div>
    <div id="clExam"></div>
  </div>
  <div class="hint">チェックはブラウザに保存されます。</div>
</main>

<script src="nodes.js"></script>
<script src="srs.js"></script>
<script>
window.addEventListener('error',function(e){
  var d=document.getElementById('errbar');
  if(!d){ d=document.createElement('div'); d.id='errbar'; d.style.cssText='position:fixed;left:0;right:0;top:0;background:#de350b;color:#fff;padding:8px 16px;z-index:99999;font-size:12px;font-family:monospace;white-space:pre-wrap'; document.body.appendChild(d); }
  d.textContent='JS エラー: '+(e.message||'')+(e.lineno?(' @ '+(e.filename||'').split('/').pop()+':'+e.lineno):'');
});

/* ============ テーマ・ポモドーロ ============ */
function toggleTheme(){
  var r=document.documentElement;
  r.dataset.theme=r.dataset.theme==='dark'?'light':'dark';
  try{ localStorage.setItem('theme',r.dataset.theme); }catch(e){}
}
try{ document.documentElement.dataset.theme=localStorage.getItem('theme')||'light'; }catch(e){}
let pomoLeft=25*60, pomoOn=false, pomoTimer=null;
function pomoFormat(s){ const m=Math.floor(s/60), ss=s%60; return String(m).padStart(2,'0')+':'+String(ss).padStart(2,'0'); }
function updatePomo(){
  document.getElementById('pomoT').textContent=pomoFormat(pomoLeft);
  document.getElementById('pomoB').textContent=pomoOn?'■':'▶';
}
function pomoToggle(){
  pomoOn=!pomoOn;
  if(pomoOn){
    pomoTimer=setInterval(()=>{
      pomoLeft--;
      if(pomoLeft<=0){ pomoLeft=25*60; pomoOn=false; clearInterval(pomoTimer); }
      updatePomo();
    },1000);
  }else{ clearInterval(pomoTimer); }
  updatePomo();
}
function navTo(name){ alert(name+'は未実装です'); return false; }
updatePomo();

/* ============ テスト日同期 ============ */
let API_BASE='';
async function resolveApiBase(){
  if(API_BASE) return;
  try{
    const r=await fetch('/api/health',{signal:AbortSignal.timeout(1000)});
    if(r.ok){ API_BASE=''; return; }
  }catch(e){}
  const cands=['http://'+location.hostname+':8000','http://localhost:8000'];
  for(const c of cands){
    try{
      const r=await fetch(c+'/api/health',{signal:AbortSignal.timeout(1500)});
      if(r.ok){ API_BASE=c; return; }
    }catch(e){}
  }
  API_BASE=cands[0];
}
async function syncTestDate(){
  try{
    await resolveApiBase();
    const res=await fetch(API_BASE+'/api/settings',{signal:AbortSignal.timeout(5000)});
    if(res.ok){
      const s=await res.json();
      if(s.test_date){
        const t=new Date(s.test_date), now=new Date();
        t.setHours(0,0,0,0); now.setHours(0,0,0,0);
        const days=Math.max(1,Math.round((t-now)/86400000));
        if(isFinite(days)&&days>0){ TEST_DAYS=days; }
      }
    }
  }catch(e){}
  renderCards();
}

/* ============ データ読み込み ============ */
const NODES=createNodes();
(function applyState(){
  try{
    const st=JSON.parse(localStorage.getItem('mapState')||'null');
    if(st) NODES.forEach(n=>{ if(st[n.id]){ n.state=st[n.id].state; n.stars=st[n.id].stars; n.day=st[n.id].day; } });
  }catch(e){}
})();

/* ============ 概要 ============ */
function renderCards(){
  const total=NODES.length;
  const green=NODES.filter(n=>n.state==='green').length;
  const pct=Math.round(green/total*100);
  const remaining=NODES.filter(n=>n.state!=='green').length;
  const dueSum=NODES.reduce((s,n)=>s+SRS.dueCount(n.id),0);
  const pace=remaining/TEST_DAYS;
  document.getElementById('cards').innerHTML=
    `<div class="card"><b>${green}/${total}</b><span>クリア済み</span><div class="sub">${pct}% 完了</div></div>`+
    `<div class="card"><b>${remaining}</b><span>未クリア ノード</span><div class="sub">テストまで ${TEST_DAYS}日</div></div>`+
    `<div class="card"><b>${pace.toFixed(2)}</b><span>必要ペース / 日</span><div class="sub ${pace<=0.5?'':'warn'}">${pace<=0.5?'計画通り':'やや遅れ'}</div></div>`+
    `<div class="card"><b>${dueSum}</b><span>今日の復習</span><div class="sub">復習キュー</div></div>`+
    `<div class="card"><b>${document.getElementById('streak').textContent}</b><span>継続日数</span><div class="sub">達成率バランス</div></div>`;
  const p=document.getElementById('cardBar');
  if(p) p.style.width=pct+'%';
}

/* ============ ノード別進捗 ============ */
function starsHTML(n){
  let s='';
  for(let i=0;i<3;i++) s+= (i<n.stars)?'●':'<span style="opacity:.25">●</span>';
  return s;
}
function renderNodes(){
  const badge={green:'b-ok',yellow:'b-warn',red:'b-ng',in_progress:'b-prog',unlocked:'b-idle',locked:'b-idle'};
  const rows=NODES.map(n=>{
    const due=SRS.dueCount(n.id), total=SRS.all(n.id).length;
    const srs=(n.type==='gate'||n.type==='boss')?'' : `<span class="srs">復習 <b>${total?due+'/'+total+'枚':'-'}</b></span>`;
    return `<div class="grow">
      <span class="badge ${badge[n.state]||'b-idle'}">${STATE_LABEL[n.state]}</span>
      <div class="nm">${n.name}</div>
      <span class="ty">${TYPE_LABEL[n.type]}</span>
      <span class="stars">${starsHTML(n)}</span>
      ${srs}</div>`;
  }).join('');
  document.getElementById('nodeGrid').innerHTML=rows;
}

/* ============ SRS 統計 ============ */
function renderSRS(){
  let total=0,due=0,reps=0,sumInt=0,sumEase=0,cards=0;
  NODES.forEach(n=>{
    SRS.all(n.id).forEach(c=>{
      total++; due+= (c.due<=0?1:0); reps+=c.reps||0; sumInt+=c.interval||0; sumEase+=c.ease||0; cards++;
    });
  });
  const avgInt=cards? (sumInt/cards).toFixed(1):'0';
  const avgEase=cards? (sumEase/cards).toFixed(2):'-';
  document.getElementById('srsCards').innerHTML=
    `<div class="card"><b>${total}</b><span>復習カード</span></div>`+
    `<div class="card"><b class="${due?'warn':''}">${due}</b><span>今日の期限</span></div>`+
    `<div class="card"><b>${avgInt}</b><span>平均間隔（日）</span></div>`+
    `<div class="card"><b>${avgEase}</b><span>平均 易しさ</span></div>`+
    `<div class="card"><b>${reps}</b><span>成功回数</span></div>`;
}

/* ============ チェックリスト ============ */
const CHECKLISTS={
  daily:[
    '今日の復習キューを完了する',
    '白紙勉強法でアウトプット',
    'ポモドーロ25分で集中して学習',
    '「なぜ」を3つ書いて振り返る',
    '睡眠7時間を確保',
  ],
  weekly:[
    '1週間分を白紙勉強法で総点検',
    '間違えた問題だけ解き直す',
    '来週のプランをAIと相談',
  ],
  exam:[
    '新規学習をやめて復習に集中',
    'テスト形式で本番シミュレーション',
    '前日は睡眠を優先',
  ],
};
const CL_KEY='checklists';
function loadCL(){ try{ return JSON.parse(localStorage.getItem(CL_KEY)||'{}')||{}; }catch(e){ return {}; } }
function saveCL(){ try{ localStorage.setItem(CL_KEY,JSON.stringify(clState)); }catch(e){} }
let clState=loadCL();
function renderCL(){
  const map={daily:['clDaily','cDaily'],weekly:['clWeekly','cWeekly'],exam:['clExam','cExam']};
  Object.keys(map).forEach(k=>{
    const items=CHECKLISTS[k];
    const state=clState[k]||{};
    let html='';
    items.forEach((t,i)=>{
      const on=!!state[i];
      html+=`<div class="clitem ${on?'on':'off'}" onclick="toggleCL('${k}',${i})">
        <span class="ck">✓</span><span>${t}</span></div>`;
    });
    document.getElementById(map[k][0]).innerHTML=html;
    const done=items.filter((_,i)=>state[i]).length;
    document.getElementById(map[k][1]).innerHTML=`<b>${done}/${items.length}</b>`;
  });
}
function toggleCL(k,i){
  clState[k]=clState[k]||{};
  clState[k][i]=!clState[k][i];
  saveCL();
  renderCL();
}

renderCards();
renderNodes();
renderSRS();
renderCL();
syncTestDate();
</script>
</body>
</html>
